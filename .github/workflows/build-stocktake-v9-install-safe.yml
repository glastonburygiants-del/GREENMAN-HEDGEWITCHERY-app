name: LEGACY - Build Stocktake V9 Proven Identity

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER_PATH="$(find "$ANDROID_HOME" -type f -name sdkmanager -path '*/cmdline-tools/*/bin/*' 2>/dev/null | sort -V | tail -n1)"
          export PATH="$(dirname "$SDKMANAGER_PATH"):$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;35.0.0"

      - name: Download exact previously working Stocktake APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/stock-v9-proven"
          mkdir -p "$WORK/base"
          gh run download 36887499810 \
            --repo "$GITHUB_REPOSITORY" \
            --name "HEDGEWITCHERY-STOCKTAKE-V8-SAFE-SYNC-run1" \
            --dir "$WORK/base"
          BASE="$(find "$WORK/base" -type f -name '*.apk' -print -quit)"
          test -n "$BASE"
          cp "$BASE" "$WORK/base.apk"
          echo "WORK=$WORK" >> "$GITHUB_ENV"

      - name: Prepare V9 HTML only
        shell: bash
        run: |
          set -euo pipefail
          python tools/normalize_stocktake_v6_for_v7.py \
            stocktake/GREENMAN_HEDGEWITCHERY_APOTHECARY_STOCKTAKE_CORRECT_V8.html \
            "$WORK/stocktake-v9-normalized.html"

          python tools/patch_stocktake_v8_cloud_connections.py \
            "$WORK/stocktake-v9-normalized.html" \
            "$WORK/index.html"

          python - "$WORK/index.html" <<'PY'
          import pathlib,re,subprocess,sys,tempfile
          html=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
          for marker in [
              'PRINT ADDRESS LABEL',
              'RESTOCK ALL WILDWOOD TO 7',
              'Subscriber spell-kit discount',
              'gmBackRefresh',
              'GM_STOCKTAKE_SYNC_ONLINE',
          ]:
              if marker not in html:
                  raise SystemExit('missing '+marker)
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.I|re.S)
          for i,script in enumerate(scripts):
              p=pathlib.Path(tempfile.gettempdir())/f'v9-proven-{i}.js'
              p.write_text(script,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          print('V9 HTML syntax verified')
          PY

      - name: Preserve proven APK and replace only assets index
        shell: bash
        run: |
          set -euo pipefail
          python - "$WORK/base.apk" "$WORK/index.html" "$WORK/unsigned.apk" <<'PY'
          import sys,zipfile
          src,html,out=sys.argv[1:]
          new_html=open(html,'rb').read()
          with zipfile.ZipFile(src,'r') as zin, zipfile.ZipFile(out,'w') as zout:
              for info in zin.infolist():
                  if info.filename.startswith('META-INF/'):
                      continue
                  if info.filename=='assets/index.html':
                      zout.writestr(info,new_html)
                  else:
                      zout.writestr(info,zin.read(info.filename))
          PY

          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -p -f 4 "$WORK/unsigned.apk" "$WORK/aligned.apk"

      - name: Re-sign with the exact proven certificate
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"

          mkdir -p "$HOME/.android"
          base64 --decode tools/greenman_release_keystore.b64 > "$HOME/.android/release.keystore"
          chmod 600 "$HOME/.android/release.keystore"

          SIGN_PASS="$(python - <<'PY'
          import pathlib,re
          s=pathlib.Path('.github/workflows/build-full-access-gate-test-apk.yml').read_text()
          m=re.search(r'--ks-pass pass:([^\s\\]+)',s)
          if not m:
              raise SystemExit('signing password source not found')
          print(m.group(1))
          PY
          )"

          OUT="$RUNNER_TEMP/GREENMAN_STOCKTAKE_V9_PROVEN_IDENTITY.apk"

          "$BT/apksigner" sign \
            --ks "$HOME/.android/release.keystore" \
            --ks-key-alias greenmanrelease2026 \
            --ks-pass "pass:$SIGN_PASS" \
            --key-pass "pass:$SIGN_PASS" \
            --out "$OUT" \
            "$WORK/aligned.apk"

          "$BT/apksigner" verify --verbose --print-certs "$OUT" | tee "$WORK/sign.txt"
          "$BT/aapt" dump badging "$OUT" | tee "$WORK/badging.txt"

          grep -q "package: name='com.greenman.hedgewitchery.stocktake' versionCode='3'" "$WORK/badging.txt"
          grep -q "versionName='STOCKTAKE-V8-SAFE-SYNC'" "$WORK/badging.txt"
          grep -q "application-label:'Greenman HedgeWitchery Apothecary Stocktake'" "$WORK/badging.txt"
          grep -q 'Signer #1 certificate SHA-256 digest: 3ffb1aea27cf9c3ec0ff8a0e6242e1f0118dd4869bfd0430ecdd9fdbba5f460e' "$WORK/sign.txt"
          unzip -p "$OUT" assets/index.html | grep -Fq 'PRINT ADDRESS LABEL'
          unzip -p "$OUT" assets/index.html | grep -Fq 'gmBackRefresh'

          sha256sum "$OUT" | tee "$WORK/sha256.txt"

      - name: Upload proven-identity Stocktake
        uses: actions/upload-artifact@v4
        with:
          name: GREENMAN-STOCKTAKE-V9-PROVEN-IDENTITY
          path: ${{ runner.temp }}/GREENMAN_STOCKTAKE_V9_PROVEN_IDENTITY.apk
          if-no-files-found: error
          retention-days: 30
