name: Build Phone Scribe BoS APK

on:
  push:
    branches:
      - hotfix/bos-save-path-20260901
    paths:
      - ".github/workflows/build-phone-scribe-bos-apk.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;35.0.0"

      - name: Download exact Action 4 APK shell
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gm-v19"
          curl -L --fail --show-error --silent \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/glastonburygiants-del/GREENMAN-HEDGEWITCHERY-app/actions/artifacts/9741657899/zip" \
            -o "$RUNNER_TEMP/gm-v19/action4.zip"
          unzip -q "$RUNNER_TEMP/gm-v19/action4.zip" -d "$RUNNER_TEMP/gm-v19/action4"
          BASE="$(find "$RUNNER_TEMP/gm-v19/action4" -type f -name '*.apk' -print -quit)"
          test -n "$BASE"
          cp "$BASE" "$RUNNER_TEMP/gm-v19/base.apk"

      - name: Fetch exact V19 HTML
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/gm-v19/GREENMAN_V19_ENERGY_LABEL_ONLY.html"
          URL='https://drive.usercontent.google.com/download?id=1UMACq8co5Loi-vApddC92FvSODXi4ODr&export=download&confirm=t'
          curl -L --fail --show-error --silent "$URL" -o "$SRC"
          test "$(stat -c%s "$SRC")" -eq 30989269
          echo "8cfbbc71ff1584056b34ec3b6686a3ce7fb39b57cbb80607aaebcca02b484519  $SRC" | sha256sum -c -
          grep -Fq "Greenman Energy ·" "$SRC"

      - name: Replace only app HTML asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gm-v19/unpacked"
          unzip -q "$RUNNER_TEMP/gm-v19/base.apk" -d "$RUNNER_TEMP/gm-v19/unpacked"
          rm -rf "$RUNNER_TEMP/gm-v19/unpacked/META-INF"
          cp "$RUNNER_TEMP/gm-v19/GREENMAN_V19_ENERGY_LABEL_ONLY.html" "$RUNNER_TEMP/gm-v19/unpacked/assets/index.html"
          echo "8cfbbc71ff1584056b34ec3b6686a3ce7fb39b57cbb80607aaebcca02b484519  $RUNNER_TEMP/gm-v19/unpacked/assets/index.html" | sha256sum -c -

      - name: Install Greenman signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode tools/greenman_debug_keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Repack align and sign
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gm-v19/unpacked"
          zip -qr "$RUNNER_TEMP/gm-v19/unsigned.apk" .
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -p -f 4 "$RUNNER_TEMP/gm-v19/unsigned.apk" "$RUNNER_TEMP/gm-v19/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$RUNNER_TEMP/GREENMAN_HEDGEWITCHERY_V19_ENERGY_LABEL.apk" \
            "$RUNNER_TEMP/gm-v19/aligned.apk"

      - name: Verify finished APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/GREENMAN_HEDGEWITCHERY_V19_ENERGY_LABEL.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/gm-v19/apksigner.txt"
          grep -Fq "Signer #1 certificate SHA-256 digest: bd22a5c3ff7335237a0e725032816eb563d2e350789e6e555369b0fe32e0c19e" "$RUNNER_TEMP/gm-v19/apksigner.txt"
          "$BT/zipalign" -c -v 4 "$APK" >/dev/null
          "$BT/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/gm-v19/badging.txt"
          grep -q "package: name='com.greenman.hedgewitchery'" "$RUNNER_TEMP/gm-v19/badging.txt"
          unzip -p "$APK" assets/index.html > "$RUNNER_TEMP/gm-v19/final-index.html"
          cmp "$RUNNER_TEMP/gm-v19/final-index.html" "$RUNNER_TEMP/gm-v19/GREENMAN_V19_ENERGY_LABEL_ONLY.html"
          sha256sum "$APK" | tee "$RUNNER_TEMP/gm-v19/final-apk-sha256.txt"

      - name: Upload V19 APK
        uses: actions/upload-artifact@v4
        with:
          name: GREENMAN-V19-ENERGY-LABEL-APK
          path: ${{ runner.temp }}/GREENMAN_HEDGEWITCHERY_V19_ENERGY_LABEL.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact V19 source and audit
        uses: actions/upload-artifact@v4
        with:
          name: GREENMAN-V19-ENERGY-LABEL-SOURCE-AUDIT
          path: |
            ${{ runner.temp }}/gm-v19/GREENMAN_V19_ENERGY_LABEL_ONLY.html
            ${{ runner.temp }}/gm-v19/apksigner.txt
            ${{ runner.temp }}/gm-v19/badging.txt
            ${{ runner.temp }}/gm-v19/final-apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
