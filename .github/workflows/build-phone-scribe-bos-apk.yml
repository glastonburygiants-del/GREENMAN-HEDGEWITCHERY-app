name: Build Phone Scribe BoS APK

on:
  workflow_dispatch:
  push:
    branches:
      - build/phone-scribe-bos-20260830
    paths:
      - "build-input/current-html/**"
      - ".github/workflows/build-phone-scribe-bos-apk.yml"

permissions:
  contents: read

jobs:
  build-phone-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Scribe HTML build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Reconstruct exact current HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/greenman-phone"
          cat build-input/current-html/part_*.txt | base64 --decode > "$RUNNER_TEMP/greenman-phone/current.html.xz"
          echo "0552f2bedd947291bd850e4d76aea454f60fa5986b056334e68ce7d97f1cfe79  $RUNNER_TEMP/greenman-phone/current.html.xz" | sha256sum -c -
          xz -dc "$RUNNER_TEMP/greenman-phone/current.html.xz" > "$RUNNER_TEMP/greenman-phone/current.html"
          echo "d828d1097fba4a014a83dfe681ba67f790d4d7abe679837ff67290953bf22adb  $RUNNER_TEMP/greenman-phone/current.html" | sha256sum -c -
          test "$(stat -c%s "$RUNNER_TEMP/greenman-phone/current.html")" -eq 30497798
          grep -q "GM TEST20" "$RUNNER_TEMP/greenman-phone/current.html"
          grep -q "gmBosFreeze" "$RUNNER_TEMP/greenman-phone/current.html"
          grep -q "BOOK OF SHADOWS" "$RUNNER_TEMP/greenman-phone/current.html"

      - name: Fetch normal phone Android project from good-current-baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin good-current-baseline
          git show FETCH_HEAD:'GREENMAN_HEDGEWITCHERY_ANDROID_PROJECT_GATHER_FIXED (1).zip' > "$RUNNER_TEMP/greenman-phone/project.zip"
          git show FETCH_HEAD:tools/greenman_debug_keystore.b64 > "$RUNNER_TEMP/greenman-phone/greenman_debug_keystore.b64"
          test -s "$RUNNER_TEMP/greenman-phone/project.zip"
          test -s "$RUNNER_TEMP/greenman-phone/greenman_debug_keystore.b64"
          mkdir -p "$RUNNER_TEMP/greenman-phone/project"
          unzip -q "$RUNNER_TEMP/greenman-phone/project.zip" -d "$RUNNER_TEMP/greenman-phone/project"
          PROJECT_DIR="$(find "$RUNNER_TEMP/greenman-phone/project" -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install normal Greenman signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode "$RUNNER_TEMP/greenman-phone/greenman_debug_keystore.b64" > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | tee "$RUNNER_TEMP/greenman-phone/key.txt"
          grep -Fq "SHA256: BD:22:A5:C3:FF:73:35:23:7A:0E:72:50:32:81:6E:B5:63:D2:E3:50:78:9E:6E:55:53:69:B0:FE:32:E0:C1:9E" "$RUNNER_TEMP/greenman-phone/key.txt"

      - name: Put current HTML into normal phone APK project
        shell: bash
        run: |
          set -euo pipefail
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"
          test -f "$INDEX_FILE"
          cp "$RUNNER_TEMP/greenman-phone/current.html" "$INDEX_FILE"
          echo "d828d1097fba4a014a83dfe681ba67f790d4d7abe679837ff67290953bf22adb  $INDEX_FILE" | sha256sum -c -
          python - "$PROJECT_DIR/app/build.gradle" <<'PY'
          from pathlib import Path
          import re, sys
          p=Path(sys.argv[1])
          s=p.read_text(encoding='utf-8')
          s,n1=re.subn(r'versionCode\s+\d+', 'versionCode 31', s, count=1)
          s,n2=re.subn(r'versionName\s+"[^"]+"', 'versionName "2.7.13-scribe-bos-test"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'version update failed: versionCode={n1}, versionName={n2}')
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'versionCode 31' "$PROJECT_DIR/app/build.gradle"
          grep -q 'versionName "2.7.13-scribe-bos-test"' "$PROJECT_DIR/app/build.gradle"

      - name: Build APK normally with Gradle
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Re-sign normal Gradle APK with Greenman update key
        shell: bash
        run: |
          set -euo pipefail
          APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name 'app-debug.apk' -print -quit)"
          test -n "$APK_FILE"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -p -f 4 "$APK_FILE" "$RUNNER_TEMP/greenman-phone/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$RUNNER_TEMP/GREENMAN_HEDGEWITCHERY_PHONE_SCRIBE_BOS_V31.apk" \
            "$RUNNER_TEMP/greenman-phone/aligned.apk"

      - name: Verify finished phone APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/GREENMAN_HEDGEWITCHERY_PHONE_SCRIBE_BOS_V31.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/greenman-phone/apksigner.txt"
          grep -Fq "Signer #1 certificate SHA-256 digest: bd22a5c3ff7335237a0e725032816eb563d2e350789e6e555369b0fe32e0c19e" "$RUNNER_TEMP/greenman-phone/apksigner.txt"
          "$BT/zipalign" -c -v 4 "$APK" >/dev/null
          "$BT/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/greenman-phone/final-badging.txt"
          grep -q "package: name='com.greenman.hedgewitchery' versionCode='31'" "$RUNNER_TEMP/greenman-phone/final-badging.txt"
          unzip -p "$APK" assets/index.html > "$RUNNER_TEMP/greenman-phone/apk-index.html"
          echo "d828d1097fba4a014a83dfe681ba67f790d4d7abe679837ff67290953bf22adb  $RUNNER_TEMP/greenman-phone/apk-index.html" | sha256sum -c -
          sha256sum "$APK" | tee "$RUNNER_TEMP/greenman-phone/final-apk-sha256.txt"

      - name: Upload finished phone APK
        uses: actions/upload-artifact@v4
        with:
          name: GREENMAN-HEDGEWITCHERY-PHONE-SCRIBE-BOS-V31-APK
          path: ${{ runner.temp }}/GREENMAN_HEDGEWITCHERY_PHONE_SCRIBE_BOS_V31.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build audit
        uses: actions/upload-artifact@v4
        with:
          name: GREENMAN-HEDGEWITCHERY-PHONE-SCRIBE-BOS-V31-AUDIT
          path: |
            ${{ runner.temp }}/greenman-phone/final-badging.txt
            ${{ runner.temp }}/greenman-phone/apksigner.txt
            ${{ runner.temp }}/greenman-phone/final-apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
