name: GREENMAN 2.0 CLEAN REBUILD - ORIGINAL APP

on:
  workflow_dispatch:
  push:
    branches:
      - clean-original-app-new-shell
    paths:
      - "GREENMAN_HEDGEWITCHERY_ANDROID_PROJECT_GATHER_FIXED*.zip"
      - "tools/patch_supply_room.py"
      - "tools/greenman_debug_keystore.b64"
      - "clean_shell_v2/**"
      - ".github/workflows/build-greenman-2-clean-rebuild.yml"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out clean pre-print branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install stable Greenman signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode "$GITHUB_WORKSPACE/tools/greenman_debug_keystore.b64" > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Unpack original Gather-fixed Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name 'GREENMAN_HEDGEWITCHERY_ANDROID_PROJECT_GATHER_FIXED*.zip' -print -quit)"
          test -s "$ZIP_FILE"
          mkdir -p "$GITHUB_WORKSPACE/extracted"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/extracted" -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "SOURCE_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Apply only the pre-print Supply Cupboard repair
        shell: bash
        run: |
          set -euo pipefail
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"
          python "$GITHUB_WORKSPACE/tools/patch_supply_room.py" "$INDEX_FILE" "$INDEX_FILE"
          echo "53224a35f792777ba70d2f13323d81f38a7037dadc9b2bb753b73157fee93cb2  $INDEX_FILE" | sha256sum -c -
          grep -q "All items rendered" "$INDEX_FILE"

      - name: Restore proven Summary page 2 fit and black-white print
        shell: bash
        run: |
          set -euo pipefail
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"
          python "$GITHUB_WORKSPACE/clean_shell_v2/install_proven_summary_print.py" "$INDEX_FILE" "$INDEX_FILE"
          echo "da7cdc5a815fc48879a48d0b044845000bbb27b5d831a723e5b587a7ee4418a1  $INDEX_FILE" | sha256sum -c -
          grep -q "data-gm-summary2-fit" "$INDEX_FILE"
          test "$(grep -o 'print-color-adjust:economy!important' "$INDEX_FILE" | wc -l)" -eq 4

      - name: Restore Greenman UI with all-mode fullscreen and Cupboard key fit
        shell: bash
        run: |
          set -euo pipefail
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"
          python "$GITHUB_WORKSPACE/clean_shell_v2/install_ui_feedback_v2.py" "$INDEX_FILE" "$INDEX_FILE"
          grep -q "Your Spell Is Gathered" "$INDEX_FILE"
          grep -q "window.gmSetPrintStatus=function" "$INDEX_FILE"
          grep -q "window.gmSetPrintStatus(true" "$INDEX_FILE"
          grep -q "The Greenman is getting your A4 page ready to print" "$INDEX_FILE"
          grep -q "The Greenman is getting your A4 pack ready to print" "$INDEX_FILE"
          grep -q "The Greenman is getting your Lite pack ready to print" "$INDEX_FILE"
          grep -q "setTimeout(requestNativeImmersive,950)" "$INDEX_FILE"
          grep -q "#gmCupboardKey{width:66px;height:66px" "$INDEX_FILE"
          ! grep -q "if(m!='lite'){" "$INDEX_FILE"
          ! grep -q "setPrintStatus(" "$INDEX_FILE"
          ! grep -q "alert('Spell gathered. Journal, shopping list, Admin capture and stock have been updated.')" "$INDEX_FILE"

      - name: Make the Cupboard welcome mat taller and brighter on opening
        shell: bash
        run: |
          set -euo pipefail
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"
          python "$GITHUB_WORKSPACE/clean_shell_v2/install_welcome_mat.py" "$INDEX_FILE" "$INDEX_FILE"
          cp "$INDEX_FILE" "$RUNNER_TEMP/EXPECTED_INDEX.html"
          sha256sum "$INDEX_FILE" | tee "$RUNNER_TEMP/GREENMAN_2_5_INDEX_SHA256.txt"
          grep -q "scale(1.015,1.18)" "$INDEX_FILE"
          grep -q "font-size:37px" "$INDEX_FILE"
          grep -q 'flood-opacity=\\\"0.88\\\"' "$INDEX_FILE"
          grep -q "drop-shadow(0 -8px 16px rgba(241,205,114,.42))" "$INDEX_FILE"

      - name: Protect the single Summary and Android print owners
        shell: bash
        run: |
          set -euo pipefail
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"
          grep -q "GM CANONICAL PRINT/PAGE ROOT OWNER" "$INDEX_FILE"
          grep -q "function renderPrint(pages,kind)" "$INDEX_FILE"
          grep -q "function buildPack()" "$INDEX_FILE"
          grep -q "function buildPage()" "$INDEX_FILE"
          grep -q "function printLiteThree()" "$INDEX_FILE"
          grep -q "function printWholeBos()" "$INDEX_FILE"
          grep -q "function printAll()" "$INDEX_FILE"
          ! grep -q "nativePrintHtml" "$INDEX_FILE"
          ! grep -q "gmNativePrintHtml" "$INDEX_FILE"
          ! grep -q "GreenmanAndroid.printHtml" "$INDEX_FILE"

      - name: Install single-owner Android shell plus fullscreen refresh only
        shell: bash
        run: |
          set -euo pipefail
          JAVA_FILE="$PROJECT_DIR/app/src/main/java/com/greenman/hedgewitchery/MainActivity.java"
          cp "$GITHUB_WORKSPACE/clean_shell_v2/MainActivity.java" "$JAVA_FILE"
          python "$GITHUB_WORKSPACE/clean_shell_v2/install_fullscreen_bridge.py" "$JAVA_FILE" "$JAVA_FILE"
          echo "08f6e0919be07f805cdac350a2d16b549789037fde724d58760488fd8486cad3  $JAVA_FILE" | sha256sum -c -
          test "$(grep -c 'public void refreshImmersive' "$JAVA_FILE")" -eq 1
          test "$(grep -c 'public void printDocument' "$JAVA_FILE")" -eq 1
          test "$(grep -c 'private void openPrintDocument' "$JAVA_FILE")" -eq 1
          test "$(grep -c 'private void printWebViewDocument' "$JAVA_FILE")" -eq 1
          ! grep -q "printCurrentPage" "$JAVA_FILE"
          ! grep -q "nativePrintHtml" "$JAVA_FILE"
          ! grep -q "gmNativePrintHtml" "$JAVA_FILE"
          ! grep -q "querySelectorAll('script,noscript')" "$JAVA_FILE"
          grep -q '"data".equalsIgnoreCase(scheme)' "$JAVA_FILE"
          grep -q 'FrameLayout.LayoutParams(820, 1120)' "$JAVA_FILE"
          grep -q 'MediaSize.ISO_A4' "$JAVA_FILE"

      - name: Set welcoming entrance test version
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 16/' "$PROJECT_DIR/app/build.gradle"
          sed -i -E 's/versionName[[:space:]]+"[^"]+"/versionName "2.5-welcome-mat"/' "$PROJECT_DIR/app/build.gradle"

      - name: Build clean APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify finished APK contains exact intended source
        shell: bash
        run: |
          set -euo pipefail
          APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name 'app-debug.apk' -print -quit)"
          test -s "$APK_FILE"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          unzip -p "$APK_FILE" assets/index.html > "$RUNNER_TEMP/apk-index.html"
          cmp -s "$RUNNER_TEMP/EXPECTED_INDEX.html" "$RUNNER_TEMP/apk-index.html"
          grep -q "window.gmSetPrintStatus=function" "$RUNNER_TEMP/apk-index.html"
          grep -q "setTimeout(requestNativeImmersive,950)" "$RUNNER_TEMP/apk-index.html"
          grep -q "#gmCupboardKey{width:66px;height:66px" "$RUNNER_TEMP/apk-index.html"
          grep -q "scale(1.015,1.18)" "$RUNNER_TEMP/apk-index.html"
          grep -q "font-size:37px" "$RUNNER_TEMP/apk-index.html"
          ! grep -q "setPrintStatus(" "$RUNNER_TEMP/apk-index.html"
          sha256sum "$APK_FILE" | tee "$RUNNER_TEMP/GREENMAN_2_5_APK_SHA256.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK_FILE" | tee "$RUNNER_TEMP/GREENMAN_2_5_BADGING.txt"
          grep -q "package: name='com.greenman.hedgewitchery' versionCode='16'" "$RUNNER_TEMP/GREENMAN_2_5_BADGING.txt"
          grep -q "application-label:'Greenman HedgeWitchery'" "$RUNNER_TEMP/GREENMAN_2_5_BADGING.txt"

      - name: Package clean rebuild source
        shell: bash
        run: |
          set -euo pipefail
          cp "$PROJECT_DIR/app/src/main/assets/index.html" "$RUNNER_TEMP/GREENMAN_HEDGEWITCHERY_2_5_WELCOME_MAT_TEST.html"
          cp "$PROJECT_DIR/app/src/main/java/com/greenman/hedgewitchery/MainActivity.java" "$RUNNER_TEMP/MainActivity_SINGLE_PRINT_OWNER.java"
          cd "$(dirname "$PROJECT_DIR")"
          zip -qr "$RUNNER_TEMP/GREENMAN_HEDGEWITCHERY_2_5_WELCOME_MAT_TEST_PROJECT.zip" "$(basename "$PROJECT_DIR")"

      - name: Upload installable 2.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: GREENMAN-HEDGEWITCHERY-2-5-WELCOME-MAT-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload 2.5 source and audit
        uses: actions/upload-artifact@v4
        with:
          name: GREENMAN-HEDGEWITCHERY-2-5-WELCOME-MAT-SOURCE
          path: |
            ${{ runner.temp }}/GREENMAN_HEDGEWITCHERY_2_5_WELCOME_MAT_TEST.html
            ${{ runner.temp }}/MainActivity_SINGLE_PRINT_OWNER.java
            ${{ runner.temp }}/GREENMAN_HEDGEWITCHERY_2_5_WELCOME_MAT_TEST_PROJECT.zip
            clean_shell_v2/BUILD_AUDIT.md
            clean_shell_v2/install_proven_summary_print.py
            clean_shell_v2/install_ui_feedback_v2.py
            clean_shell_v2/install_fullscreen_bridge.py
            clean_shell_v2/install_welcome_mat.py
            ${{ runner.temp }}/GREENMAN_2_5_INDEX_SHA256.txt
            ${{ runner.temp }}/GREENMAN_2_5_APK_SHA256.txt
            ${{ runner.temp }}/GREENMAN_2_5_BADGING.txt
          if-no-files-found: error
          retention-days: 30
