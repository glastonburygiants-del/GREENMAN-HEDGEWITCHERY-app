name: Build Stocktake V9 Back Office

on:
  push:
    branches:
      - integration/stocktake-v9-backoffice
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out safe sync branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER_PATH="$(find "$ANDROID_HOME" -type f -name sdkmanager -path '*/cmdline-tools/*/bin/*' 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$SDKMANAGER_PATH" ]; then
            ZIP="$RUNNER_TEMP/cmdline-tools.zip"
            curl -fsSL -o "$ZIP" "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            unzip -q "$ZIP" -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            SDKMANAGER_PATH="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          export PATH="$(dirname "$SDKMANAGER_PATH"):$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download known-good normal Android shell and current full HTML
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/stock-v8-safe"
          mkdir -p "$WORK/normal" "$WORK/current"

          gh run download 36565965264 \
            --repo "$GITHUB_REPOSITORY" \
            --name "GREENMAN-HEDGEWITCHERY-APOTHECARY-FV3-APK-run192" \
            --dir "$WORK/normal"

          gh run download 36720982687 \
            --repo "$GITHUB_REPOSITORY" \
            --name "GREENMAN-HEDGEWITCHERY-FULL-ACCESS-GATE-TEST-APK-run1" \
            --dir "$WORK/current"

          NORMAL="$(find "$WORK/normal" -type f -name '*.apk' -print -quit)"
          CURRENT="$(find "$WORK/current" -type f -name '*.apk' -print -quit)"
          test -n "$NORMAL"
          test -n "$CURRENT"
          cp "$NORMAL" "$WORK/normal.apk"
          cp "$CURRENT" "$WORK/current.apk"
          unzip -p "$WORK/current.apk" assets/index.html > "$WORK/current-index.html"
          test -s "$WORK/current-index.html"
          echo "WORK=$WORK" >> "$GITHUB_ENV"

      - name: Prepare corrected V8 HTML and safe cloud connections
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --show-error --silent \
            -o "$WORK/apktool.jar" \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar

          python tools/normalize_stocktake_v6_for_v7.py \
            stocktake/GREENMAN_HEDGEWITCHERY_APOTHECARY_STOCKTAKE_CORRECT_V8.html \
            "$WORK/stocktake-v8-normalized.html"

          python tools/patch_stocktake_v8_cloud_connections.py \
            "$WORK/stocktake-v8-normalized.html" \
            "$WORK/stocktake-v8-safe.html"

          python tools/patch_main_stall_cloud_sync.py \
            "$WORK/current-index.html" \
            "$WORK/main-safe-index.html"

          node tools/verify_inline_scripts.js "$WORK/main-safe-index.html"

          python - "$WORK/stocktake-v8-safe.html" <<'PY'
          import pathlib,re,subprocess,sys,tempfile
          html=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.I|re.S)
          if not scripts: raise SystemExit('Stocktake inline script not found')
          for i,script in enumerate(scripts):
              p=pathlib.Path(tempfile.gettempdir())/f'stocktake-safe-{i}.js'
              p.write_text(script,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          print(f'Verified {len(scripts)} Stocktake inline script(s)')
          PY

          grep -Fq 'gm-stall-cloud-sync-v1' "$WORK/main-safe-index.html"
          grep -Fq 'stall_pull' "$WORK/main-safe-index.html"
          grep -Fq 'stall_push' "$WORK/main-safe-index.html"
          grep -Fq 'gm-stocktake-v8-cloud-connections' "$WORK/stocktake-v8-safe.html"
          grep -Fq 'GM_STOCKTAKE_STALL_SYNC' "$WORK/stocktake-v8-safe.html"
          grep -Fq 'GM_STOCKTAKE_SYNC_ONLINE' "$WORK/stocktake-v8-safe.html"
          grep -Fq 'PRINT ADDRESS LABEL' "$WORK/stocktake-v8-safe.html"
          grep -Fq 'RESTOCK ALL WILDWOOD TO 7' "$WORK/stocktake-v8-safe.html"
          grep -Fq 'Subscriber spell-kit discount' "$WORK/stocktake-v8-safe.html"
          grep -Fq 'gmBackRefresh' "$WORK/stocktake-v8-safe.html"

          if grep -Eq 'WildwoodBridge|GMStockBridge|WILDWOOD_STOCK_BRIDGE|WildwoodStockProvider' "$WORK/main-safe-index.html" "$WORK/stocktake-v8-safe.html"; then
            echo "Native bridge marker leaked into safe build"
            exit 1
          fi

      - name: Decode known-good shell for main and Stocktake
        shell: bash
        run: |
          set -euo pipefail
          java -jar "$WORK/apktool.jar" d -f "$WORK/normal.apk" -o "$WORK/main-decoded"
          cp -a "$WORK/main-decoded" "$WORK/stock-decoded"

          grep -Fq 'package="com.greenman.hedgewitchery"' "$WORK/main-decoded/AndroidManifest.xml"
          if grep -Eq 'fullaccesstest|WILDWOOD_STOCK_BRIDGE|WildwoodStockProvider|com.greenman.hedgewitchery.stockbridge' "$WORK/main-decoded/AndroidManifest.xml"; then
            echo "Known-good normal base contains an unexpected bridge/test marker"
            exit 1
          fi

      - name: Build HedgeWitchery Android App with pure Web Stall sync
        shell: bash
        run: |
          set -euo pipefail
          cp "$WORK/main-safe-index.html" "$WORK/main-decoded/assets/index.html"

          python - "$WORK/main-decoded/apktool.yml" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]);s=p.read_text()
          s=re.sub(r'(?m)^  versionCode:.*$', '  versionCode: 90', s)
          s=re.sub(r'(?m)^  versionName:.*$', '  versionName: FV3.5.4-STALL-SYNC', s)
          p.write_text(s)
          PY

          grep -Fq 'package="com.greenman.hedgewitchery"' "$WORK/main-decoded/AndroidManifest.xml"
          if grep -Eq 'WILDWOOD_STOCK_BRIDGE|WildwoodStockProvider|com.greenman.hedgewitchery.stockbridge' "$WORK/main-decoded/AndroidManifest.xml"; then
            echo "Native bridge present in main manifest"
            exit 1
          fi

      - name: Build standalone corrected Stocktake V8 with no native bridge
        shell: bash
        run: |
          set -euo pipefail
          python tools/patch_stocktake_manifest_safe.py "$WORK/stock-decoded/AndroidManifest.xml"
          cp "$WORK/stocktake-v8-safe.html" "$WORK/stock-decoded/assets/index.html"

          python - "$WORK/stock-decoded/apktool.yml" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]);s=p.read_text()
          s=re.sub(r'(?m)^  versionCode:.*$', '  versionCode: 4', s)
          s=re.sub(r'(?m)^  versionName:.*$', '  versionName: STOCKTAKE-V9-BACKOFFICE', s)
          p.write_text(s)
          PY

          grep -Fq 'package="com.greenman.hedgewitchery.stocktake"' "$WORK/stock-decoded/AndroidManifest.xml"
          if grep -Eq 'WILDWOOD_STOCK_BRIDGE|WildwoodStockProvider|com.greenman.hedgewitchery.stockbridge' "$WORK/stock-decoded/AndroidManifest.xml"; then
            echo "Native bridge present in Stocktake manifest"
            exit 1
          fi

      - name: Build align and sign both APKs
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          java -jar "$WORK/apktool.jar" b "$WORK/main-decoded" -o "$WORK/main-unsigned.apk"
          java -jar "$WORK/apktool.jar" b "$WORK/stock-decoded" -o "$WORK/stock-unsigned.apk"

          python tools/force_resources_arsc_stored.py "$WORK/main-unsigned.apk"
          python tools/force_resources_arsc_stored.py "$WORK/stock-unsigned.apk"
          "$BT/zipalign" -p -f 4 "$WORK/main-unsigned.apk" "$WORK/main-aligned.apk"
          "$BT/zipalign" -p -f 4 "$WORK/stock-unsigned.apk" "$WORK/stock-aligned.apk"

          mkdir -p "$HOME/.android"
          base64 --decode tools/greenman_release_keystore.b64 > "$HOME/.android/release.keystore"
          chmod 600 "$HOME/.android/release.keystore"

          SIGN_PASS="$(python - <<'PY'
          import pathlib,re
          s=pathlib.Path('.github/workflows/build-full-access-gate-test-apk.yml').read_text()
          m=re.search(r'--ks-pass pass:([^\s\\]+)',s)
          if not m: raise SystemExit('release signing password source not found')
          print(m.group(1))
          PY
          )"

          "$BT/apksigner" sign \
            --ks "$HOME/.android/release.keystore" \
            --ks-key-alias greenmanrelease2026 \
            --ks-pass "pass:$SIGN_PASS" \
            --key-pass "pass:$SIGN_PASS" \
            --out "$RUNNER_TEMP/HEDGEWITCHERY_ANDROID_FV3_5_4_STALL_SYNC_run${{ github.run_number }}.apk" \
            "$WORK/main-aligned.apk"

          "$BT/apksigner" sign \
            --ks "$HOME/.android/release.keystore" \
            --ks-key-alias greenmanrelease2026 \
            --ks-pass "pass:$SIGN_PASS" \
            --key-pass "pass:$SIGN_PASS" \
            --out "$RUNNER_TEMP/HEDGEWITCHERY_STOCKTAKE_V9_BACKOFFICE_run${{ github.run_number }}.apk" \
            "$WORK/stock-aligned.apk"

      - name: Verify native footprint stays clean
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          MAIN="$RUNNER_TEMP/HEDGEWITCHERY_ANDROID_FV3_5_4_STALL_SYNC_run${{ github.run_number }}.apk"
          STOCK="$RUNNER_TEMP/HEDGEWITCHERY_STOCKTAKE_V8_SAFE_SYNC_run${{ github.run_number }}.apk"

          "$BT/apksigner" verify --verbose --print-certs "$MAIN" | tee "$WORK/main-sign.txt"
          "$BT/apksigner" verify --verbose --print-certs "$STOCK" | tee "$WORK/stock-sign.txt"
          "$BT/aapt" dump badging "$MAIN" | tee "$WORK/main-badging.txt"
          "$BT/aapt" dump badging "$STOCK" | tee "$WORK/stock-badging.txt"

          grep -q "package: name='com.greenman.hedgewitchery' versionCode='90'" "$WORK/main-badging.txt"
          grep -q "versionName='FV3.5.4-STALL-SYNC'" "$WORK/main-badging.txt"
          grep -q "package: name='com.greenman.hedgewitchery.stocktake' versionCode='4'" "$WORK/stock-badging.txt"

          grep -q 'Signer #1 certificate SHA-256 digest: 3ffb1aea27cf9c3ec0ff8a0e6242e1f0118dd4869bfd0430ecdd9fdbba5f460e' "$WORK/main-sign.txt"
          MAIN_CERT="$(grep -m1 'Signer #1 certificate SHA-256 digest:' "$WORK/main-sign.txt" | sed 's/.*digest: //')"
          STOCK_CERT="$(grep -m1 'Signer #1 certificate SHA-256 digest:' "$WORK/stock-sign.txt" | sed 's/.*digest: //')"
          test "$MAIN_CERT" = "$STOCK_CERT"

          unzip -p "$MAIN" assets/index.html > "$WORK/final-main.html"
          unzip -p "$STOCK" assets/index.html > "$WORK/final-stock.html"

          grep -Fq 'gm-stall-cloud-sync-v1' "$WORK/final-main.html"
          grep -Fq 'gm-stocktake-v8-cloud-connections' "$WORK/final-stock.html"

          for APK in "$MAIN" "$STOCK"; do
            unzip -p "$APK" AndroidManifest.xml > "$WORK/manifest.bin"
            if strings "$WORK/manifest.bin" | grep -Eq 'WILDWOOD_STOCK_BRIDGE|WildwoodStockProvider|com.greenman.hedgewitchery.stockbridge'; then
              echo "Forbidden native bridge marker found"
              exit 1
            fi
          done

          python - "$MAIN" "$STOCK" <<'PY'
          import sys,zipfile
          for p in sys.argv[1:]:
              with zipfile.ZipFile(p) as z:
                  if z.getinfo('resources.arsc').compress_type != zipfile.ZIP_STORED:
                      raise SystemExit(p+' has compressed resources.arsc')
          print('resources.arsc stored in both APKs')
          PY

          sha256sum "$MAIN" "$STOCK" | tee "$WORK/apk-sha256.txt"

      - name: Upload safe HedgeWitchery Android App
        uses: actions/upload-artifact@v4
        with:
          name: HEDGEWITCHERY-ANDROID-FV3-5-4-STALL-SYNC-SAFE-run${{ github.run_number }}
          path: ${{ runner.temp }}/HEDGEWITCHERY_ANDROID_FV3_5_4_STALL_SYNC_run${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload safe corrected Stocktake V8
        uses: actions/upload-artifact@v4
        with:
          name: HEDGEWITCHERY-STOCKTAKE-V9-BACKOFFICE-run${{ github.run_number }}
          path: ${{ runner.temp }}/HEDGEWITCHERY_STOCKTAKE_V8_SAFE_SYNC_run${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload safe-sync audit
        uses: actions/upload-artifact@v4
        with:
          name: HEDGEWITCHERY-STOCK-V8-SAFE-SYNC-AUDIT
          path: |
            ${{ runner.temp }}/stock-v8-safe/main-badging.txt
            ${{ runner.temp }}/stock-v8-safe/stock-badging.txt
            ${{ runner.temp }}/stock-v8-safe/main-sign.txt
            ${{ runner.temp }}/stock-v8-safe/stock-sign.txt
            ${{ runner.temp }}/stock-v8-safe/apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
