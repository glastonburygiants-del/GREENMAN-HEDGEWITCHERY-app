name: Build HedgeWitchery Key Maker APK

on:
  workflow_dispatch:
  push:
    branches:
      - standalone/hedgewitchery-key-maker
    paths:
      - "KEYMAKER_BUILD_TRIGGER.txt"

permissions:
  contents: read

jobs:
  build-key-maker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Key Maker branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check private Key Maker credential
        env:
          KEYMAKER_TOKEN: ${{ secrets.GREENMAN_KEYMAKER_DEVICE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KEYMAKER_TOKEN" ]; then
            echo "Missing repository secret: GREENMAN_KEYMAKER_DEVICE_TOKEN"
            exit 1
          fi

      - name: Install stable test signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode "$GITHUB_WORKSPACE/tools/greenman_debug_keystore.b64" > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Build standalone Key Maker APK
        env:
          KEYMAKER_TOKEN: ${{ secrets.GREENMAN_KEYMAKER_DEVICE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/keymaker-android"
          gradle :app:assembleDebug --no-daemon --stacktrace -PkeymakerToken="$KEYMAKER_TOKEN"

      - name: Verify standalone APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/keymaker-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK_FILE=$APK" >> "$GITHUB_ENV"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/keymaker_badging.txt"
          grep -q "package: name='com.greenman.hedgewitchery.keymaker'" "$RUNNER_TEMP/keymaker_badging.txt"
          grep -q "application-label:'Greenman HedgeWitchery Apothecary Key Maker'" "$RUNNER_TEMP/keymaker_badging.txt"
          sha256sum "$APK"

      - name: Upload HedgeWitchery Key Maker APK
        uses: actions/upload-artifact@v4
        with:
          name: GREENMAN-HEDGEWITCHERY-APOTHECARY-KEY-MAKER-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 30
