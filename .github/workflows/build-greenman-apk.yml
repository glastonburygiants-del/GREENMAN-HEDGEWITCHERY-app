name: Build Greenman APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/supply-room-load-fix
      - agent/customer-journal-print-fix
    paths:
      - "GREENMAN_HEDGEWITCHERY_ANDROID_PROJECT_GATHER_FIXED*.zip"
      - "tools/patch_supply_room.py"
      - "tools/patch_customer_print.py"
      - "tools/validate_greenman.py"
      - "tools/greenman_debug_keystore.b64"
      - ".github/workflows/build-greenman-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install stable Greenman test signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode "$GITHUB_WORKSPACE/tools/greenman_debug_keystore.b64" > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Unpack protected Greenman project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name 'GREENMAN_HEDGEWITCHERY_ANDROID_PROJECT_GATHER_FIXED*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Corrected Greenman Android project ZIP was not found."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/extracted"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/extracted" -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android settings.gradle was not found inside the ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Building protected project from: $PROJECT_DIR"

      - name: Apply Supply Cupboard room-load repair
        shell: bash
        run: |
          set -euo pipefail
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"
          python "$GITHUB_WORKSPACE/tools/patch_supply_room.py" "$INDEX_FILE" "$INDEX_FILE"
          grep -q "All items rendered" "$INDEX_FILE"

      - name: Apply Journal, Gather and A4 print repair
        shell: bash
        run: |
          set -euo pipefail
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"
          JAVA_FILE="$PROJECT_DIR/app/src/main/java/com/greenman/hedgewitchery/MainActivity.java"
          python "$GITHUB_WORKSPACE/tools/patch_customer_print.py" "$INDEX_FILE" "$INDEX_FILE" "$JAVA_FILE" "$JAVA_FILE"
          python - "$INDEX_FILE" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          old = 'When you wish to keep the full working,'
          new = 'When you wish to keep the full spell,'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Forbidden customer wording: expected 1 match, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          sed -i 's/versionCode 1/versionCode 3/' "$PROJECT_DIR/app/build.gradle"
          sed -i 's/versionName "1.0"/versionName "1.2-test"/' "$PROJECT_DIR/app/build.gradle"
          grep -q "Your Spell Is Gathered" "$INDEX_FILE"
          grep -q "When you wish to keep the full spell" "$INDEX_FILE"
          if grep -q "keep the full working" "$INDEX_FILE"; then
            echo "Forbidden customer wording remains."
            exit 1
          fi
          grep -q "GreenmanAndroid.printHtml" "$JAVA_FILE"
          python "$GITHUB_WORKSPACE/tools/validate_greenman.py" "$INDEX_FILE"
          sha256sum "$INDEX_FILE" "$JAVA_FILE"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name 'app-debug.apk' -print -quit)"
          if [ -z "$APK_FILE" ]; then
            echo "APK was not produced."
            exit 1
          fi
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          sha256sum "$APK_FILE"

      - name: Package repaired HTML and Android project
        shell: bash
        run: |
          set -euo pipefail
          cp "$PROJECT_DIR/app/src/main/assets/index.html" "$RUNNER_TEMP/GREENMAN_HEDGEWITCHERY_CUSTOMER_JOURNAL_PRINT_FIXED_V2.html"
          cd "$(dirname "$PROJECT_DIR")"
          zip -qr "$RUNNER_TEMP/GREENMAN_HEDGEWITCHERY_ANDROID_PROJECT_CUSTOMER_PRINT_FIXED_V2.zip" "$(basename "$PROJECT_DIR")"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: GREENMAN-HEDGEWITCHERY-CUSTOMER-PRINT-FIX-V2-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload repaired source files
        uses: actions/upload-artifact@v4
        with:
          name: GREENMAN-HEDGEWITCHERY-CUSTOMER-PRINT-FIX-V2-SOURCE
          path: |
            ${{ runner.temp }}/GREENMAN_HEDGEWITCHERY_CUSTOMER_JOURNAL_PRINT_FIXED_V2.html
            ${{ runner.temp }}/GREENMAN_HEDGEWITCHERY_ANDROID_PROJECT_CUSTOMER_PRINT_FIXED_V2.zip
          if-no-files-found: error
          retention-days: 30
