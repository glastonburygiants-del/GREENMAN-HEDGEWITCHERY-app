name: Build Greenman APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/supply-room-load-fix
      - agent/customer-journal-print-fix
      - agent/android-boundary-db-guard
      - agent/oak-king-app-icon
    paths:
      - "GREENMAN_HEDGEWITCHERY_ANDROID_PROJECT_GATHER_FIXED*.zip"
      - "tools/patch_supply_room.py"
      - "tools/patch_customer_print.py"
      - "tools/patch_lite_print_android.py"
      - "tools/validate_greenman.py"
      - "tools/verify_database_unchanged.py"
      - "tools/apply_oak_king_icon.py"
      - "tools/oak_king_icon_source.part*.b64"
      - "tools/greenman_debug_keystore.b64"
      - ".github/workflows/build-greenman-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install stable Greenman test signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode "$GITHUB_WORKSPACE/tools/greenman_debug_keystore.b64" > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Unpack protected Greenman project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name 'GREENMAN_HEDGEWITCHERY_ANDROID_PROJECT_GATHER_FIXED*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Corrected Greenman Android project ZIP was not found."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/extracted"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/extracted" -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android settings.gradle was not found inside the ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          cp "$PROJECT_DIR/app/src/main/assets/index.html" "$RUNNER_TEMP/GREENMAN_DATABASE_BASELINE.html"
          echo "Building protected project from: $PROJECT_DIR"

      - name: Apply Supply Cupboard room-load repair
        shell: bash
        run: |
          set -euo pipefail
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"
          python "$GITHUB_WORKSPACE/tools/patch_supply_room.py" "$INDEX_FILE" "$INDEX_FILE"
          grep -q "All items rendered" "$INDEX_FILE"

      - name: Apply Journal, Gather and A4 print repair
        shell: bash
        run: |
          set -euo pipefail
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"
          JAVA_FILE="$PROJECT_DIR/app/src/main/java/com/greenman/hedgewitchery/MainActivity.java"
          python "$GITHUB_WORKSPACE/tools/patch_customer_print.py" "$INDEX_FILE" "$INDEX_FILE" "$JAVA_FILE" "$JAVA_FILE"
          python "$GITHUB_WORKSPACE/tools/patch_lite_print_android.py" "$INDEX_FILE" "$INDEX_FILE"
          python - "$INDEX_FILE" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          old = 'When you wish to keep the full working,'
          new = 'When you wish to keep the full spell,'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Forbidden customer wording: expected 1 match, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          sed -i 's/versionCode 1/versionCode 5/' "$PROJECT_DIR/app/build.gradle"
          sed -i 's/versionName "1.0"/versionName "1.4-test"/' "$PROJECT_DIR/app/build.gradle"
          grep -q "Your Spell Is Gathered" "$INDEX_FILE"
          grep -q "When you wish to keep the full spell" "$INDEX_FILE"
          grep -q "PRINT LITE PACK" "$INDEX_FILE"
          grep -q "__GM_LITE_PRINT_NATIVE_WIRED__" "$INDEX_FILE"
          grep -q "GreenmanAndroid.printHtml(liteHtml,liteTitle)" "$INDEX_FILE"
          if grep -q "keep the full working" "$INDEX_FILE"; then
            echo "Forbidden customer wording remains."
            exit 1
          fi
          grep -q "GreenmanAndroid.printHtml" "$JAVA_FILE"
          python "$GITHUB_WORKSPACE/tools/validate_greenman.py" "$INDEX_FILE"
          sha256sum "$INDEX_FILE" "$JAVA_FILE"

      - name: Verify database and storage contract
        shell: bash
        run: |
          set -euo pipefail
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"
          python "$GITHUB_WORKSPACE/tools/verify_database_unchanged.py" \
            "$RUNNER_TEMP/GREENMAN_DATABASE_BASELINE.html" \
            "$INDEX_FILE" \
            "$RUNNER_TEMP/GREENMAN_DATABASE_CONTRACT_BUILD_REPORT.json"

      - name: Install exact Oak King launcher icon
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet "Pillow==10.4.0"
          python "$GITHUB_WORKSPACE/tools/apply_oak_king_icon.py" "$PROJECT_DIR" \
            | tee "$RUNNER_TEMP/OAK_KING_ICON_BUILD_REPORT.txt"
          test ! -e "$PROJECT_DIR/app/src/main/res/drawable/ic_launcher_foreground.xml"
          test ! -e "$PROJECT_DIR/app/src/main/res/mipmap-anydpi/ic_launcher.xml"
          test -s "$PROJECT_DIR/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png"
          test -s "$PROJECT_DIR/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK and packaged launcher
        shell: bash
        run: |
          set -euo pipefail
          APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name 'app-debug.apk' -print -quit)"
          if [ -z "$APK_FILE" ]; then
            echo "APK was not produced."
            exit 1
          fi
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          sha256sum "$APK_FILE"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK_FILE" \
            | tee "$RUNNER_TEMP/OAK_KING_APK_BADGING.txt"
          grep -q "application-icon" "$RUNNER_TEMP/OAK_KING_APK_BADGING.txt"
          grep -q "application-label:'Greenman HedgeWitchery'" "$RUNNER_TEMP/OAK_KING_APK_BADGING.txt"

      - name: Package Oak King Lite-print Android project
        shell: bash
        run: |
          set -euo pipefail
          cp "$PROJECT_DIR/app/src/main/assets/index.html" "$RUNNER_TEMP/GREENMAN_HEDGEWITCHERY_OAK_KING_LITE_PRINT_FIXED.html"
          cd "$(dirname "$PROJECT_DIR")"
          zip -qr "$RUNNER_TEMP/GREENMAN_HEDGEWITCHERY_ANDROID_PROJECT_OAK_KING_LITE_PRINT_FIXED.zip" "$(basename "$PROJECT_DIR")"

      - name: Upload Oak King Lite-print APK
        uses: actions/upload-artifact@v4
        with:
          name: GREENMAN-HEDGEWITCHERY-OAK-KING-LITE-PRINT-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Oak King Lite-print source and audit reports
        uses: actions/upload-artifact@v4
        with:
          name: GREENMAN-HEDGEWITCHERY-OAK-KING-LITE-PRINT-SOURCE
          path: |
            ${{ runner.temp }}/GREENMAN_HEDGEWITCHERY_OAK_KING_LITE_PRINT_FIXED.html
            ${{ runner.temp }}/GREENMAN_HEDGEWITCHERY_ANDROID_PROJECT_OAK_KING_LITE_PRINT_FIXED.zip
            ${{ runner.temp }}/GREENMAN_DATABASE_CONTRACT_BUILD_REPORT.json
            ${{ runner.temp }}/OAK_KING_ICON_BUILD_REPORT.txt
            ${{ runner.temp }}/OAK_KING_APK_BADGING.txt
          if-no-files-found: error
          retention-days: 30
