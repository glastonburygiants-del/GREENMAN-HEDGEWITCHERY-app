name: Build Stocktake + Wildwood Bridge

on:
  push:
    branches:
      - integration/stocktake-wildwood-supabase-v2
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER_PATH="$(find "$ANDROID_HOME" -type f -name sdkmanager -path '*/cmdline-tools/*/bin/*' 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$SDKMANAGER_PATH" ]; then
            ZIP="$RUNNER_TEMP/cmdline-tools.zip"
            curl -fsSL -o "$ZIP" "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            unzip -q "$ZIP" -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            SDKMANAGER_PATH="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          export PATH="$(dirname "$SDKMANAGER_PATH"):$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download the proven full-app test APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/stock-integration"
          mkdir -p "$WORK/proven"
          gh run download 36720982687 \
            --repo "$GITHUB_REPOSITORY" \
            --name "GREENMAN-HEDGEWITCHERY-FULL-ACCESS-GATE-TEST-APK-run1" \
            --dir "$WORK/proven"
          PROVEN="$(find "$WORK/proven" -type f -name '*.apk' -print -quit)"
          test -n "$PROVEN"
          cp "$PROVEN" "$WORK/proven-full.apk"
          echo "WORK=$WORK" >> "$GITHUB_ENV"

      - name: Prepare Stocktake V7 and APK tooling
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --show-error --silent \
            -o "$WORK/apktool.jar" \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar

          python tools/patch_stocktake_v7_connections.py \
            stocktake/GREENMAN_HEDGEWITCHERY_APOTHECARY_STOCKTAKE_V6.html \
            "$WORK/stocktake-v7.html"

          node tools/verify_inline_scripts.js "$WORK/stocktake-v7.html"
          grep -Fq 'gm-stocktake-v7-connections' "$WORK/stocktake-v7.html"
          grep -Fq 'WildwoodBridge' "$WORK/stocktake-v7.html"
          grep -Fq 'greenman-stocktake-private' "$WORK/stocktake-v7.html"
          grep -Fq 'SEND THIS STOCKTAKE ONLINE' "$WORK/stocktake-v7.html"
          grep -Fq 'LOAD ONLINE STOCK' "$WORK/stocktake-v7.html"
          grep -Fq 'SYNC ONLINE' "$WORK/stocktake-v7.html"

      - name: Compile Wildwood bridge helper classes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK/main-classes" "$WORK/main-dex" "$WORK/stock-classes" "$WORK/stock-dex"

          javac -source 8 -target 8 \
            -cp "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d "$WORK/main-classes" \
            tools/WildwoodStockProvider.java tools/WildwoodWebBridge.java

          "$ANDROID_HOME/build-tools/35.0.0/d8" \
            --min-api 29 \
            --output "$WORK/main-dex" \
            "$WORK/main-classes/com/greenman/hedgewitchery/WildwoodStockProvider.class" \
            "$WORK/main-classes/com/greenman/hedgewitchery/WildwoodWebBridge.class"

          javac -source 8 -target 8 \
            -cp "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d "$WORK/stock-classes" \
            tools/StocktakeWildwoodClient.java

          "$ANDROID_HOME/build-tools/35.0.0/d8" \
            --min-api 29 \
            --output "$WORK/stock-dex" \
            "$WORK/stock-classes/com/greenman/hedgewitchery/StocktakeWildwoodClient.class"

      - name: Decode proven APK into both apps
        shell: bash
        run: |
          set -euo pipefail
          java -jar "$WORK/apktool.jar" d -f "$WORK/proven-full.apk" -o "$WORK/main-decoded"
          cp -a "$WORK/main-decoded" "$WORK/stock-decoded"

      - name: Add Wildwood bridge to HedgeWitchery Android App
        shell: bash
        run: |
          set -euo pipefail
          python tools/patch_manifest_test_to_main.py "$WORK/main-decoded/AndroidManifest.xml"
          python tools/patch_wildwood_provider_manifest.py "$WORK/main-decoded/AndroidManifest.xml"

          python tools/patch_wildwood_stock_bridge_html.py \
            "$WORK/main-decoded/assets/index.html" \
            "$WORK/main-index.html"
          cp "$WORK/main-index.html" "$WORK/main-decoded/assets/index.html"
          node tools/verify_inline_scripts.js "$WORK/main-index.html"

          python tools/patch_register_wildwood_bridge.py \
            "$WORK/main-decoded/smali_classes2/com/greenman/hedgewitchery/MainActivity.smali"

          mkdir -p "$WORK/main-helper-apk"
          cp "$WORK/main-decoded/AndroidManifest.xml" "$WORK/main-helper-apk/AndroidManifest.xml"
          cp "$WORK/main-dex/classes.dex" "$WORK/main-helper-apk/classes.dex"
          (cd "$WORK/main-helper-apk" && zip -q "$WORK/main-helper.apk" AndroidManifest.xml classes.dex)
          java -jar "$WORK/apktool.jar" d -f -r "$WORK/main-helper.apk" -o "$WORK/main-helper-decoded"

          mkdir -p "$WORK/main-decoded/smali_classes4/com/greenman/hedgewitchery"
          for cls in WildwoodStockProvider WildwoodWebBridge; do
            SRC="$(find "$WORK/main-helper-decoded" -type f -name "$cls.smali" -print -quit)"
            test -n "$SRC"
            cp "$SRC" "$WORK/main-decoded/smali_classes4/com/greenman/hedgewitchery/$cls.smali"
          done

          python - "$WORK/main-decoded/apktool.yml" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]);s=p.read_text()
          s=re.sub(r'(?m)^  versionCode:.*$', '  versionCode: 74', s)
          s=re.sub(r'(?m)^  versionName:.*$', '  versionName: FV3.5.2-STOCK-BRIDGE', s)
          p.write_text(s)
          PY

          grep -Fq 'com.greenman.hedgewitchery.stockbridge' "$WORK/main-decoded/AndroidManifest.xml"
          grep -Fq 'android:protectionLevel="signature"' "$WORK/main-decoded/AndroidManifest.xml"
          grep -Fq 'GMStockBridge' "$WORK/main-decoded/smali_classes2/com/greenman/hedgewitchery/MainActivity.smali"
          grep -Fq 'gm_admin_stock_v1' "$WORK/main-index.html"
          grep -Fq 'gm_stock_deduction_log' "$WORK/main-index.html"

      - name: Build standalone Stocktake APK with Wildwood pipe
        shell: bash
        run: |
          set -euo pipefail
          python tools/patch_manifest_test_to_main.py "$WORK/stock-decoded/AndroidManifest.xml"
          python tools/patch_stocktake_manifest.py "$WORK/stock-decoded/AndroidManifest.xml"
          cp "$WORK/stocktake-v7.html" "$WORK/stock-decoded/assets/index.html"

          python tools/patch_register_stocktake_bridge.py \
            "$WORK/stock-decoded/smali_classes2/com/greenman/hedgewitchery/MainActivity.smali"

          mkdir -p "$WORK/stock-helper-apk"
          cp "$WORK/stock-decoded/AndroidManifest.xml" "$WORK/stock-helper-apk/AndroidManifest.xml"
          cp "$WORK/stock-dex/classes.dex" "$WORK/stock-helper-apk/classes.dex"
          (cd "$WORK/stock-helper-apk" && zip -q "$WORK/stock-helper.apk" AndroidManifest.xml classes.dex)
          java -jar "$WORK/apktool.jar" d -f -r "$WORK/stock-helper.apk" -o "$WORK/stock-helper-decoded"

          mkdir -p "$WORK/stock-decoded/smali_classes4/com/greenman/hedgewitchery"
          SRC="$(find "$WORK/stock-helper-decoded" -type f -name 'StocktakeWildwoodClient.smali' -print -quit)"
          test -n "$SRC"
          cp "$SRC" "$WORK/stock-decoded/smali_classes4/com/greenman/hedgewitchery/StocktakeWildwoodClient.smali"

          python - "$WORK/stock-decoded/apktool.yml" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]);s=p.read_text()
          s=re.sub(r'(?m)^  versionCode:.*$', '  versionCode: 1', s)
          s=re.sub(r'(?m)^  versionName:.*$', '  versionName: STOCKTAKE-1.0', s)
          p.write_text(s)
          PY

          grep -Fq 'package="com.greenman.hedgewitchery.stocktake"' "$WORK/stock-decoded/AndroidManifest.xml"
          grep -Fq 'com.greenman.hedgewitchery.permission.WILDWOOD_STOCK_BRIDGE' "$WORK/stock-decoded/AndroidManifest.xml"
          grep -Fq 'com.greenman.hedgewitchery.stockbridge' "$WORK/stock-decoded/AndroidManifest.xml"
          grep -Fq 'WildwoodBridge' "$WORK/stock-decoded/smali_classes2/com/greenman/hedgewitchery/MainActivity.smali"

      - name: Build align and sign both APKs
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          java -jar "$WORK/apktool.jar" b "$WORK/main-decoded" -o "$WORK/main-unsigned.apk"
          java -jar "$WORK/apktool.jar" b "$WORK/stock-decoded" -o "$WORK/stock-unsigned.apk"
          python tools/force_resources_arsc_stored.py "$WORK/main-unsigned.apk"
          python tools/force_resources_arsc_stored.py "$WORK/stock-unsigned.apk"
          "$BT/zipalign" -p -f 4 "$WORK/main-unsigned.apk" "$WORK/main-aligned.apk"
          "$BT/zipalign" -p -f 4 "$WORK/stock-unsigned.apk" "$WORK/stock-aligned.apk"

          mkdir -p "$HOME/.android"
          base64 --decode tools/greenman_release_keystore.b64 > "$HOME/.android/release.keystore"
          chmod 600 "$HOME/.android/release.keystore"

          "$BT/apksigner" sign \
            --ks "$HOME/.android/release.keystore" \
            --ks-key-alias greenmanrelease2026 \
            --ks-pass pass:greenmanhedgewitchery2026 \
            --key-pass pass:greenmanhedgewitchery2026 \
            --out "$RUNNER_TEMP/GREENMAN_HEDGEWITCHERY_APOTHECARY_STOCK_BRIDGE_run${{ github.run_number }}.apk" \
            "$WORK/main-aligned.apk"

          "$BT/apksigner" sign \
            --ks "$HOME/.android/release.keystore" \
            --ks-key-alias greenmanrelease2026 \
            --ks-pass pass:greenmanhedgewitchery2026 \
            --key-pass pass:greenmanhedgewitchery2026 \
            --out "$RUNNER_TEMP/GREENMAN_HEDGEWITCHERY_APOTHECARY_STOCKTAKE_run${{ github.run_number }}.apk" \
            "$WORK/stock-aligned.apk"

      - name: Verify packages bridge and signatures
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          MAIN="$RUNNER_TEMP/GREENMAN_HEDGEWITCHERY_APOTHECARY_STOCK_BRIDGE_run${{ github.run_number }}.apk"
          STOCK="$RUNNER_TEMP/GREENMAN_HEDGEWITCHERY_APOTHECARY_STOCKTAKE_run${{ github.run_number }}.apk"

          "$BT/apksigner" verify --verbose --print-certs "$MAIN" | tee "$WORK/main-sign.txt"
          "$BT/apksigner" verify --verbose --print-certs "$STOCK" | tee "$WORK/stock-sign.txt"
          "$BT/aapt" dump badging "$MAIN" | tee "$WORK/main-badging.txt"
          "$BT/aapt" dump badging "$STOCK" | tee "$WORK/stock-badging.txt"

          grep -q "package: name='com.greenman.hedgewitchery' versionCode='74'" "$WORK/main-badging.txt"
          grep -q "versionName='FV3.5.2-STOCK-BRIDGE'" "$WORK/main-badging.txt"
          grep -q "package: name='com.greenman.hedgewitchery.stocktake' versionCode='1'" "$WORK/stock-badging.txt"
          grep -q "versionName='STOCKTAKE-1.0'" "$WORK/stock-badging.txt"
          grep -q "application-label:'Greenman HedgeWitchery Apothecary Stocktake'" "$WORK/stock-badging.txt"

          MAIN_CERT="$(grep -m1 'Signer #1 certificate SHA-256 digest:' "$WORK/main-sign.txt" | sed 's/.*digest: //')"
          STOCK_CERT="$(grep -m1 'Signer #1 certificate SHA-256 digest:' "$WORK/stock-sign.txt" | sed 's/.*digest: //')"
          test -n "$MAIN_CERT"
          test "$MAIN_CERT" = "$STOCK_CERT"

          unzip -p "$MAIN" assets/index.html > "$WORK/final-main.html"
          unzip -p "$STOCK" assets/index.html > "$WORK/final-stock.html"
          grep -Fq 'gm-wildwood-stock-bridge-v1' "$WORK/final-main.html"
          grep -Fq 'GMStockBridge' "$WORK/final-main.html"
          grep -Fq 'gm-stocktake-v7-connections' "$WORK/final-stock.html"
          grep -Fq 'greenman-stocktake-private' "$WORK/final-stock.html"
          grep -Fq 'WildwoodBridge' "$WORK/final-stock.html"
          grep -Fq 'GM_STOCKTAKE_SYNC_ONLINE' "$WORK/final-stock.html"

          unzip -p "$MAIN" classes4.dex | strings | grep -Fq 'WildwoodStockProvider'
          unzip -p "$MAIN" classes4.dex | strings | grep -Fq 'WildwoodWebBridge'
          unzip -p "$STOCK" classes4.dex | strings | grep -Fq 'StocktakeWildwoodClient'

          python - "$MAIN" "$STOCK" <<'PY'
          import sys,zipfile
          for p in sys.argv[1:]:
              with zipfile.ZipFile(p) as z:
                  if z.getinfo('resources.arsc').compress_type != zipfile.ZIP_STORED:
                      raise SystemExit(p+' has compressed resources.arsc')
          print('resources.arsc stored in both APKs')
          PY

          sha256sum "$MAIN" "$STOCK" | tee "$WORK/apk-sha256.txt"

      - name: Upload rebuilt HedgeWitchery Android App
        uses: actions/upload-artifact@v4
        with:
          name: GREENMAN-HEDGEWITCHERY-APOTHECARY-STOCK-BRIDGE-run${{ github.run_number }}
          path: ${{ runner.temp }}/GREENMAN_HEDGEWITCHERY_APOTHECARY_STOCK_BRIDGE_run${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload standalone Stocktake APK
        uses: actions/upload-artifact@v4
        with:
          name: GREENMAN-HEDGEWITCHERY-APOTHECARY-STOCKTAKE-run${{ github.run_number }}
          path: ${{ runner.temp }}/GREENMAN_HEDGEWITCHERY_APOTHECARY_STOCKTAKE_run${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload integration audit
        uses: actions/upload-artifact@v4
        with:
          name: GREENMAN-HEDGEWITCHERY-STOCK-INTEGRATION-AUDIT
          path: |
            ${{ runner.temp }}/stock-integration/main-badging.txt
            ${{ runner.temp }}/stock-integration/stock-badging.txt
            ${{ runner.temp }}/stock-integration/main-sign.txt
            ${{ runner.temp }}/stock-integration/stock-sign.txt
            ${{ runner.temp }}/stock-integration/apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
