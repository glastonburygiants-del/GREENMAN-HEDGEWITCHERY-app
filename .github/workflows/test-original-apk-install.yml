name: Diagnose Original Greenman APK Install
on:
  push:
    branches: [main]
    paths: [.github/workflows/test-original-apk-install.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  android-10-update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download run211 and run214 APKs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/greenman-install/run211" "$RUNNER_TEMP/greenman-install/run214"
          gh run download 43491888986 --repo "$GITHUB_REPOSITORY" --name GREENMAN-HEDGEWITCHERY-APOTHECARY-FV3-APK-run211 --dir "$RUNNER_TEMP/greenman-install/run211"
          gh run download 43497539652 --repo "$GITHUB_REPOSITORY" --name GREENMAN-HEDGEWITCHERY-APOTHECARY-FV3-APK-run214 --dir "$RUNNER_TEMP/greenman-install/run214"
          OLD_APK="$RUNNER_TEMP/greenman-install/run211/GREENMAN_HEDGEWITCHERY_APOTHECARY_FV3_run211.apk"
          NEW_APK="$RUNNER_TEMP/greenman-install/run214/GREENMAN_HEDGEWITCHERY_APOTHECARY_FV3_run214.apk"
          test -f "$OLD_APK"
          test -f "$NEW_APK"
          echo "OLD_APK=$OLD_APK" >> "$GITHUB_ENV"
          echo "NEW_APK=$NEW_APK" >> "$GITHUB_ENV"
      - name: Install and upgrade on Android 10 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            adb install "$OLD_APK"
            adb shell dumpsys package com.greenman.hedgewitchery | grep -E 'Package \[com.greenman.hedgewitchery\]|versionCode=|versionName='
            adb install -r "$NEW_APK"
            adb shell dumpsys package com.greenman.hedgewitchery | grep -E 'Package \[com.greenman.hedgewitchery\]|versionCode=|versionName='
            adb shell am start -n com.greenman.hedgewitchery/com.greenman.hedgewitchery.MainActivity
            adb logcat -d -t 500 | grep -E 'FATAL EXCEPTION|INSTALL_FAILED|PackageInstaller' || true
            echo "Run211 installed and run214 upgraded on Android 10."
