name: Build Isolated Greenman BoS Preview
on:
  workflow_dispatch:
  push:
    branches: [design/bos-manuscript-v39-safe]
    paths: [.github/workflows/build-bos-v39-isolated-preview.yml]
permissions:
  contents: read
  actions: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Retrieve verified V42 APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/greenman-preview"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          mkdir -p "$WORK/input"
          gh run download 43114802261 --repo "$GITHUB_REPOSITORY" --name GREENMAN-HEDGEWITCHERY-APOTHECARY-FV3-APK-run199 --dir "$WORK/input"
          SOURCE="$WORK/input/GREENMAN_HEDGEWITCHERY_APOTHECARY_FV3_run199.apk"
          echo "SOURCE=$SOURCE" >> "$GITHUB_ENV"
          echo "9b4fb9a6e7a746b43da16a5a1703b4112cbaa7008fde1748de32b6db69a71a74  $SOURCE" | sha256sum -c -
      - name: Decode and isolate installer identity
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$WORK/apktool.jar" https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          java -jar "$WORK/apktool.jar" d -f -s "$SOURCE" -o "$WORK/decoded"
          # The preview is its own app; advance its version to update V41 safely.
          sed -i 's/versionCode: 73/versionCode: 75/' "$WORK/decoded/apktool.yml"
          grep -Fq "versionCode: 75" "$WORK/decoded/apktool.yml"
          sed -i 's/versionName: .*/versionName: FV3.5.3-V42-PREVIEW/' "$WORK/decoded/apktool.yml"
          python - "$WORK/decoded/AndroidManifest.xml" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path(sys.argv[1]);s=p.read_text(encoding='utf-8')
          root=ET.fromstring(s);ns='{http://schemas.android.com/apk/res/android}'
          assert root.attrib['package']=='com.greenman.hedgewitchery'
          assert len(root.findall('.//activity'))==1
          assert root.find('.//activity').attrib[ns+'name']=='com.greenman.hedgewitchery.MainActivity'
          assert not any(list(root.iter(tag)) for tag in ('provider','service','receiver'))
          m=re.search(r'<manifest\b[^>]*>',s,re.S)
          assert m and m.group().count('package="com.greenman.hedgewitchery"')==1
          s=s[:m.start()]+m.group().replace('package="com.greenman.hedgewitchery"','package="com.greenman.hedgewitchery.bospreview"')+s[m.end():]
          m=re.search(r'<application\b[^>]*>',s,re.S)
          assert m and m.group().count('android:label="@string/app_name"')==1
          s=s[:m.start()]+m.group().replace('android:label="@string/app_name"','android:label="Greenman BoS V42 Preview"')+s[m.end():]
          after=ET.fromstring(s)
          assert after.attrib['package']=='com.greenman.hedgewitchery.bospreview'
          assert after.find('.//activity').attrib[ns+'name']=='com.greenman.hedgewitchery.MainActivity'
          assert after.find('application').attrib[ns+'label']=='Greenman BoS V42 Preview'
          p.write_text(s,encoding='utf-8')
          print('Confirmed isolated package identity, unchanged launcher Java class and distinct preview label.')
          PY
      - name: Build sign and check preview
        shell: bash
        run: |
          set -euo pipefail
          java -jar "$WORK/apktool.jar" b "$WORK/decoded" -o "$WORK/unsigned.apk"
          python tools/force_resources_arsc_stored.py "$WORK/unsigned.apk"
          BT="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -printf '%h\n' | sort -V | tail -1)"
          if [ -z "$BT" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -path '*/cmdline-tools/*/bin/*' | sort -V | tail -1)"
            test -n "$SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "build-tools;35.0.0"
            BT="$ANDROID_HOME/build-tools/35.0.0"
          fi
          "$BT/zipalign" -p -f 4 "$WORK/unsigned.apk" "$WORK/aligned.apk"
          # Reference the existing signer rather than generating a new key.
          python - "$WORK/pass.txt" <<'PY'
          import re,sys
          from pathlib import Path
          s=Path('.github/workflows/build-v24-bind-storage-apk.yml').read_text()
          a=re.search(r'--ks-pass pass:([^\s]+)',s); b=re.search(r'--key-pass pass:([^\s]+)',s)
          assert a and b and a.group(1)==b.group(1)
          p=Path(sys.argv[1]);p.write_text(a.group(1)+'\n');p.chmod(0o600)
          PY
          cp "$WORK/pass.txt" "$WORK/key-pass.txt"
          base64 --decode tools/greenman_release_keystore.b64 > "$WORK/release.keystore"
          chmod 600 "$WORK/release.keystore"
          "$BT/apksigner" sign --ks "$WORK/release.keystore" --ks-key-alias greenmanrelease2026 --ks-pass "file:$WORK/pass.txt" --key-pass "file:$WORK/key-pass.txt" --out "$WORK/Greenman_BoS_V42_Preview.apk" "$WORK/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs "$WORK/Greenman_BoS_V42_Preview.apk" | tee "$WORK/certificate.txt"
          "$BT/zipalign" -c -v 4 "$WORK/Greenman_BoS_V42_Preview.apk" >/dev/null
          "$BT/aapt" dump badging "$WORK/Greenman_BoS_V42_Preview.apk" | tee "$WORK/badging.txt"
          grep -Fq "package: name='com.greenman.hedgewitchery.bospreview'" "$WORK/badging.txt"
          grep -Fq "versionCode='75'" "$WORK/badging.txt"
          grep -Fq "application-label:'Greenman BoS V42 Preview'" "$WORK/badging.txt"
          grep -Fq 'certificate SHA-256 digest: 3ffb1aea27cf9c3ec0ff8a0e6242e1f0118dd4869bfd0430ecdd9fdbba5f460e' "$WORK/certificate.txt"
          python - "$SOURCE" "$WORK/Greenman_BoS_V42_Preview.apk" <<'PY'
          import sys,zipfile,hashlib
          with zipfile.ZipFile(sys.argv[1]) as original,zipfile.ZipFile(sys.argv[2]) as preview:
            assert original.testzip() is None and preview.testzip() is None
            for name in ('assets/index.html','assets/greenman_bower.html','assets/greenman_scribe.html','assets/greenman_treehouse.html','classes.dex','classes2.dex','classes3.dex'):
              assert hashlib.sha256(original.read(name)).digest()==hashlib.sha256(preview.read(name)).digest(),name
            assert preview.getinfo('resources.arsc').compress_type==zipfile.ZIP_STORED
          print('All four app rooms and three native dex files unchanged from verified V42 APK.')
          PY
          sha256sum "$WORK/Greenman_BoS_V42_Preview.apk"
      - name: Upload side-by-side test APK
        uses: actions/upload-artifact@v4
        with:
          name: Greenman-BoS-V42-Separate-Preview
          path: ${{ runner.temp }}/greenman-preview/Greenman_BoS_V42_Preview.apk
          if-no-files-found: error
          retention-days: 30
