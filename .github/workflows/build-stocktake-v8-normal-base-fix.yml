name: Build Stocktake V8 From Known-Good Normal Base

on:
  push:
    branches:
      - integration/stocktake-v8-normal-base-fix
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER_PATH="$(find "$ANDROID_HOME" -type f -name sdkmanager -path '*/cmdline-tools/*/bin/*' 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$SDKMANAGER_PATH" ]; then
            ZIP="$RUNNER_TEMP/cmdline-tools.zip"
            curl -fsSL -o "$ZIP" "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            unzip -q "$ZIP" -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            SDKMANAGER_PATH="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          export PATH="$(dirname "$SDKMANAGER_PATH"):$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download known-good normal app and current full-test app
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/stock-v8-r192"
          mkdir -p "$WORK/normal" "$WORK/current"

          gh run download 36565965264 \
            --repo "$GITHUB_REPOSITORY" \
            --name "GREENMAN-HEDGEWITCHERY-APOTHECARY-FV3-APK-run192" \
            --dir "$WORK/normal"

          gh run download 36720982687 \
            --repo "$GITHUB_REPOSITORY" \
            --name "GREENMAN-HEDGEWITCHERY-FULL-ACCESS-GATE-TEST-APK-run1" \
            --dir "$WORK/current"

          NORMAL="$(find "$WORK/normal" -type f -name '*.apk' -print -quit)"
          CURRENT="$(find "$WORK/current" -type f -name '*.apk' -print -quit)"
          test -n "$NORMAL"
          test -n "$CURRENT"
          cp "$NORMAL" "$WORK/normal-r192.apk"
          cp "$CURRENT" "$WORK/current-full-test.apk"
          unzip -p "$WORK/current-full-test.apk" assets/index.html > "$WORK/current-index.html"
          test -s "$WORK/current-index.html"
          echo "WORK=$WORK" >> "$GITHUB_ENV"

      - name: Prepare corrected Stocktake V8
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --show-error --silent \
            -o "$WORK/apktool.jar" \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar

          python tools/normalize_stocktake_v6_for_v7.py \
            stocktake/GREENMAN_HEDGEWITCHERY_APOTHECARY_STOCKTAKE_CORRECT_V8.html \
            "$WORK/stocktake-v8-normalized.html"

          python tools/patch_stocktake_v7_connections.py \
            "$WORK/stocktake-v8-normalized.html" \
            "$WORK/stocktake-v8-connected.html"

          grep -Fq 'gm-stocktake-v7-connections' "$WORK/stocktake-v8-connected.html"
          grep -Fq 'WildwoodBridge' "$WORK/stocktake-v8-connected.html"
          grep -Fq 'greenman-stocktake-private' "$WORK/stocktake-v8-connected.html"
          grep -Fq 'SEND THIS STOCKTAKE ONLINE' "$WORK/stocktake-v8-connected.html"
          grep -Fq 'LOAD ONLINE STOCK' "$WORK/stocktake-v8-connected.html"
          grep -Fq 'SYNC ONLINE' "$WORK/stocktake-v8-connected.html"

      - name: Compile bridge classes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK/main-classes" "$WORK/main-dex" "$WORK/stock-classes" "$WORK/stock-dex"

          javac -source 8 -target 8 \
            -cp "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d "$WORK/main-classes" \
            tools/WildwoodStockProvider.java tools/WildwoodWebBridge.java

          "$ANDROID_HOME/build-tools/35.0.0/d8" \
            --min-api 29 \
            --output "$WORK/main-dex" \
            "$WORK/main-classes/com/greenman/hedgewitchery/WildwoodStockProvider.class" \
            "$WORK/main-classes/com/greenman/hedgewitchery/WildwoodWebBridge.class"

          javac -source 8 -target 8 \
            -cp "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d "$WORK/stock-classes" \
            tools/StocktakeWildwoodClient.java

          "$ANDROID_HOME/build-tools/35.0.0/d8" \
            --min-api 29 \
            --output "$WORK/stock-dex" \
            "$WORK/stock-classes/com/greenman/hedgewitchery/StocktakeWildwoodClient.class"

      - name: Decode known-good normal shell for both APKs
        shell: bash
        run: |
          set -euo pipefail
          java -jar "$WORK/apktool.jar" d -f "$WORK/normal-r192.apk" -o "$WORK/main-decoded"
          cp -a "$WORK/main-decoded" "$WORK/stock-decoded"

          grep -Fq 'package="com.greenman.hedgewitchery"' "$WORK/main-decoded/AndroidManifest.xml"
          if grep -Fq 'fullaccesstest' "$WORK/main-decoded/AndroidManifest.xml"; then
            echo "Wrong native base: test package found"
            exit 1
          fi

      - name: Add only the Wildwood bridge to the normal app shell
        shell: bash
        run: |
          set -euo pipefail
          python tools/patch_wildwood_provider_manifest.py "$WORK/main-decoded/AndroidManifest.xml"

          python tools/patch_wildwood_stock_bridge_html.py \
            "$WORK/current-index.html" \
            "$WORK/main-index.html"
          cp "$WORK/main-index.html" "$WORK/main-decoded/assets/index.html"
          node tools/verify_inline_scripts.js "$WORK/main-index.html"

          MAIN_ACTIVITY="$(find "$WORK/main-decoded" -path '*/com/greenman/hedgewitchery/MainActivity.smali' -print -quit)"
          test -n "$MAIN_ACTIVITY"
          python tools/patch_register_wildwood_bridge.py "$MAIN_ACTIVITY"

          mkdir -p "$WORK/main-helper-apk"
          cp "$WORK/main-decoded/AndroidManifest.xml" "$WORK/main-helper-apk/AndroidManifest.xml"
          cp "$WORK/main-dex/classes.dex" "$WORK/main-helper-apk/classes.dex"
          (cd "$WORK/main-helper-apk" && zip -q "$WORK/main-helper.apk" AndroidManifest.xml classes.dex)
          java -jar "$WORK/apktool.jar" d -f -r "$WORK/main-helper.apk" -o "$WORK/main-helper-decoded"

          mkdir -p "$WORK/main-decoded/smali_classes4/com/greenman/hedgewitchery"
          for cls in WildwoodStockProvider WildwoodWebBridge; do
            SRC="$(find "$WORK/main-helper-decoded" -type f -name "$cls.smali" -print -quit)"
            test -n "$SRC"
            cp "$SRC" "$WORK/main-decoded/smali_classes4/com/greenman/hedgewitchery/$cls.smali"
          done

          python - "$WORK/main-decoded/apktool.yml" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]);s=p.read_text()
          s=re.sub(r'(?m)^  versionCode:.*$', '  versionCode: 73', s)
          s=re.sub(r'(?m)^  versionName:.*$', '  versionName: FV3.5.3', s)
          p.write_text(s)
          PY

          grep -Fq 'package="com.greenman.hedgewitchery"' "$WORK/main-decoded/AndroidManifest.xml"
          grep -Fq 'com.greenman.hedgewitchery.stockbridge' "$WORK/main-decoded/AndroidManifest.xml"
          grep -Fq 'android:protectionLevel="signature"' "$WORK/main-decoded/AndroidManifest.xml"
          grep -Fq 'GMStockBridge' "$MAIN_ACTIVITY"
          grep -Fq 'gm-customer-access-gate-v1' "$WORK/main-index.html"
          grep -Fq 'gm_admin_stock_v1' "$WORK/main-index.html"
          grep -Fq 'gm_stock_deduction_log' "$WORK/main-index.html"

      - name: Build corrected standalone Stocktake V8 from normal shell
        shell: bash
        run: |
          set -euo pipefail
          python tools/patch_stocktake_manifest.py "$WORK/stock-decoded/AndroidManifest.xml"
          cp "$WORK/stocktake-v8-connected.html" "$WORK/stock-decoded/assets/index.html"

          STOCK_ACTIVITY="$(find "$WORK/stock-decoded" -path '*/com/greenman/hedgewitchery/MainActivity.smali' -print -quit)"
          test -n "$STOCK_ACTIVITY"
          python tools/patch_register_stocktake_bridge.py "$STOCK_ACTIVITY"

          mkdir -p "$WORK/stock-helper-apk"
          cp "$WORK/stock-decoded/AndroidManifest.xml" "$WORK/stock-helper-apk/AndroidManifest.xml"
          cp "$WORK/stock-dex/classes.dex" "$WORK/stock-helper-apk/classes.dex"
          (cd "$WORK/stock-helper-apk" && zip -q "$WORK/stock-helper.apk" AndroidManifest.xml classes.dex)
          java -jar "$WORK/apktool.jar" d -f -r "$WORK/stock-helper.apk" -o "$WORK/stock-helper-decoded"

          mkdir -p "$WORK/stock-decoded/smali_classes4/com/greenman/hedgewitchery"
          SRC="$(find "$WORK/stock-helper-decoded" -type f -name 'StocktakeWildwoodClient.smali' -print -quit)"
          test -n "$SRC"
          cp "$SRC" "$WORK/stock-decoded/smali_classes4/com/greenman/hedgewitchery/StocktakeWildwoodClient.smali"

          python - "$WORK/stock-decoded/apktool.yml" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]);s=p.read_text()
          s=re.sub(r'(?m)^  versionCode:.*$', '  versionCode: 2', s)
          s=re.sub(r'(?m)^  versionName:.*$', '  versionName: STOCKTAKE-V8-CONNECTED-R2', s)
          p.write_text(s)
          PY

          grep -Fq 'package="com.greenman.hedgewitchery.stocktake"' "$WORK/stock-decoded/AndroidManifest.xml"
          grep -Fq 'com.greenman.hedgewitchery.permission.WILDWOOD_STOCK_BRIDGE' "$WORK/stock-decoded/AndroidManifest.xml"
          grep -Fq 'com.greenman.hedgewitchery.stockbridge' "$WORK/stock-decoded/AndroidManifest.xml"
          grep -Fq 'WildwoodBridge' "$STOCK_ACTIVITY"

      - name: Build align and sign both APKs
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          java -jar "$WORK/apktool.jar" b "$WORK/main-decoded" -o "$WORK/main-unsigned.apk"
          java -jar "$WORK/apktool.jar" b "$WORK/stock-decoded" -o "$WORK/stock-unsigned.apk"

          python tools/force_resources_arsc_stored.py "$WORK/main-unsigned.apk"
          python tools/force_resources_arsc_stored.py "$WORK/stock-unsigned.apk"
          "$BT/zipalign" -p -f 4 "$WORK/main-unsigned.apk" "$WORK/main-aligned.apk"
          "$BT/zipalign" -p -f 4 "$WORK/stock-unsigned.apk" "$WORK/stock-aligned.apk"

          mkdir -p "$HOME/.android"
          base64 --decode tools/greenman_release_keystore.b64 > "$HOME/.android/release.keystore"
          chmod 600 "$HOME/.android/release.keystore"

          SIGN_PASS="$(python - <<'PY'
          import pathlib,re
          s=pathlib.Path('.github/workflows/build-full-access-gate-test-apk.yml').read_text()
          m=re.search(r'--ks-pass pass:([^\s\\]+)',s)
          if not m: raise SystemExit('release signing password source not found')
          print(m.group(1))
          PY
          )"

          "$BT/apksigner" sign \
            --ks "$HOME/.android/release.keystore" \
            --ks-key-alias greenmanrelease2026 \
            --ks-pass "pass:$SIGN_PASS" \
            --key-pass "pass:$SIGN_PASS" \
            --out "$RUNNER_TEMP/HEDGEWITCHERY_ANDROID_FV3_5_3_STOCK_BRIDGE_run${{ github.run_number }}.apk" \
            "$WORK/main-aligned.apk"

          "$BT/apksigner" sign \
            --ks "$HOME/.android/release.keystore" \
            --ks-key-alias greenmanrelease2026 \
            --ks-pass "pass:$SIGN_PASS" \
            --key-pass "pass:$SIGN_PASS" \
            --out "$RUNNER_TEMP/HEDGEWITCHERY_STOCKTAKE_V8_CONNECTED_R2_run${{ github.run_number }}.apk" \
            "$WORK/stock-aligned.apk"

      - name: Verify known-good lineage and bridge
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          MAIN="$RUNNER_TEMP/HEDGEWITCHERY_ANDROID_FV3_5_3_STOCK_BRIDGE_run${{ github.run_number }}.apk"
          STOCK="$RUNNER_TEMP/HEDGEWITCHERY_STOCKTAKE_V8_CONNECTED_R2_run${{ github.run_number }}.apk"

          "$BT/apksigner" verify --verbose --print-certs "$MAIN" | tee "$WORK/main-sign.txt"
          "$BT/apksigner" verify --verbose --print-certs "$STOCK" | tee "$WORK/stock-sign.txt"
          "$BT/aapt" dump badging "$MAIN" | tee "$WORK/main-badging.txt"
          "$BT/aapt" dump badging "$STOCK" | tee "$WORK/stock-badging.txt"

          grep -q "package: name='com.greenman.hedgewitchery' versionCode='73'" "$WORK/main-badging.txt"
          grep -q "versionName='FV3.5.3'" "$WORK/main-badging.txt"
          grep -q "package: name='com.greenman.hedgewitchery.stocktake' versionCode='2'" "$WORK/stock-badging.txt"

          grep -q 'Signer #1 certificate SHA-256 digest: 3ffb1aea27cf9c3ec0ff8a0e6242e1f0118dd4869bfd0430ecdd9fdbba5f460e' "$WORK/main-sign.txt"
          MAIN_CERT="$(grep -m1 'Signer #1 certificate SHA-256 digest:' "$WORK/main-sign.txt" | sed 's/.*digest: //')"
          STOCK_CERT="$(grep -m1 'Signer #1 certificate SHA-256 digest:' "$WORK/stock-sign.txt" | sed 's/.*digest: //')"
          test "$MAIN_CERT" = "$STOCK_CERT"

          unzip -p "$MAIN" assets/index.html > "$WORK/final-main.html"
          unzip -p "$STOCK" assets/index.html > "$WORK/final-stock.html"
          grep -Fq 'gm-customer-access-gate-v1' "$WORK/final-main.html"
          grep -Fq 'gm-wildwood-stock-bridge-v1' "$WORK/final-main.html"
          grep -Fq 'gm-stocktake-v7-connections' "$WORK/final-stock.html"

          sha256sum "$MAIN" "$STOCK" | tee "$WORK/apk-sha256.txt"

      - name: Upload normal-base HedgeWitchery Android App
        uses: actions/upload-artifact@v4
        with:
          name: HEDGEWITCHERY-ANDROID-FV3-5-3-STOCK-BRIDGE-NORMAL-BASE-run${{ github.run_number }}
          path: ${{ runner.temp }}/HEDGEWITCHERY_ANDROID_FV3_5_3_STOCK_BRIDGE_run${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload corrected Stocktake V8 APK
        uses: actions/upload-artifact@v4
        with:
          name: HEDGEWITCHERY-STOCKTAKE-V8-CONNECTED-R2-run${{ github.run_number }}
          path: ${{ runner.temp }}/HEDGEWITCHERY_STOCKTAKE_V8_CONNECTED_R2_run${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload normal-base audit
        uses: actions/upload-artifact@v4
        with:
          name: HEDGEWITCHERY-STOCK-V8-NORMAL-BASE-AUDIT
          path: |
            ${{ runner.temp }}/stock-v8-r192/main-badging.txt
            ${{ runner.temp }}/stock-v8-r192/stock-badging.txt
            ${{ runner.temp }}/stock-v8-r192/main-sign.txt
            ${{ runner.temp }}/stock-v8-r192/stock-sign.txt
            ${{ runner.temp }}/stock-v8-r192/apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
