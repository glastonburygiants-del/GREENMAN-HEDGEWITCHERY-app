name: GREENMAN 2.7.11 GRIMOIRE ONE PAGE + GREENMAN DIALOGS - INSPECTABLE

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-final-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install stable Greenman signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode "$GITHUB_WORKSPACE/tools/greenman_debug_keystore.b64" > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > "$RUNNER_TEMP/GREENMAN_STABLE_KEY.txt"

      - name: Build and audit 2.7.11
        shell: bash
        run: bash "$GITHUB_WORKSPACE/clean_shell_v2/build_2_7_final_candidate_ci.sh"

      - name: Prove one-page Grimoire, Greenman dialogs and signing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, os, re
          td=Path(os.environ['RUNNER_TEMP'])
          p=td/'GREENMAN_27_EXPECTED.html'
          s=p.read_text(encoding='utf-8')
          st=s.index('const PAGES = ')+len('const PAGES = ')
          pages,_=json.JSONDecoder().raw_decode(s[st:])
          bos=pages['bos']; grim=pages['grimoire']
          assert 'gm-grimoire-single-page-v2' in bos
          assert 'gm-grimoire-one' in bos
          assert 'gm-grimoire-split-1' not in bos and 'gm-grimoire-split-2' not in bos
          builder=bos[bos.index('function buildGrimoirePages(e){'):bos.index('\n\nfunction fitTextInsideBox',bos.index('function buildGrimoirePages(e){'))]
          assert "'1 of 1'" in builder
          assert "'1 of 2'" not in builder and "'2 of 2'" not in builder
          mi=grim.index('const ITEMS =')+len('const ITEMS =')
          items,_=json.JSONDecoder().raw_decode(grim[mi:].lstrip())
          acorn=next(x for x in items if str(x.get('_name') or x.get('Name') or '').upper()=='ACORN')
          fields=[acorn.get('Magical Uses',''),acorn.get('Powers',''),acorn.get('Greenman Energy',''),acorn.get('Description',''),acorn.get('Folk Lore',''),acorn.get('Geology',''),acorn.get('Warning','')]
          weight=len(' '.join(map(str,fields)))
          alert_pages=[]
          native_confirms=[]
          for name,html in pages.items():
              if re.search(r'\balert\s*\(',html):
                  alert_pages.append(name)
                  assert '__GM_GREENMAN_DIALOG_SHIM__' in html, 'alert page lacks shim: '+name
              if re.search(r'\bconfirm\s*\(',html):
                  native_confirms.append(name)
          assert not native_confirms, 'native confirm remains in '+','.join(native_confirms)
          assert 'gm-greenman-dialog-style' in s[:st]
          assert '__GM_GREENMAN_DIALOG_OWNER__' in s
          proof=td/'GREENMAN_2_7_11_ONE_PAGE_DIALOG_PROOF.txt'
          proof.write_text(
              '2.7.11 ONE PAGE + GREENMAN DIALOG PROOF\n'
              f'Packaged HTML bytes: {len(s.encode("utf-8"))}.\n'
              f'ACORN long-entry text weight: {weight} characters; builder remains 1 of 1.\n'
              'Grimoire split markers: 0.\n'
              f'Pages containing alert calls routed through Greenman shim: {len(alert_pages)} ({", ".join(alert_pages)}).\n'
              'Native confirm() call sites: 0.\n'
              'One outer parchment-and-gold dialog owner serves the app.\n',encoding='utf-8')
          print(proof.read_text(encoding='utf-8'))
          PY

          APK_FILE="${APK_FILE:?APK_FILE missing}"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK_FILE" > "$RUNNER_TEMP/GREENMAN_2_7_11_APK_CERT.txt"
          python - <<'PY'
          from pathlib import Path
          import os,re
          td=Path(os.environ['RUNNER_TEMP'])
          kt=(td/'GREENMAN_STABLE_KEY.txt').read_text(encoding='utf-8',errors='ignore')
          at=(td/'GREENMAN_2_7_11_APK_CERT.txt').read_text(encoding='utf-8',errors='ignore')
          km=re.search(r'SHA256\s*:\s*([0-9A-Fa-f:]+)',kt,re.I)
          am=re.search(r'certificate\s+SHA-256\s+digest\s*:\s*([0-9A-Fa-f:]+)',at,re.I)
          if not km or not am:
              raise SystemExit('Could not parse signing fingerprints')
          norm=lambda x:re.sub(r'[^0-9A-F]','',x.upper())
          key_fp=norm(km.group(1)); apk_fp=norm(am.group(1))
          print('Stable key SHA256:',key_fp)
          print('APK signer SHA256:',apk_fp)
          if key_fp!=apk_fp:
              raise SystemExit('APK signer does not match stable Greenman key')
          (td/'GREENMAN_2_7_11_SIGNING_PROOF.txt').write_text('Stable APK signer verified: '+apk_fp+'\n',encoding='utf-8')
          PY

      - name: Upload 2.7.11 APK
        uses: actions/upload-artifact@v4
        with:
          name: GREENMAN-HEDGEWITCHERY-2-7-11-GRIMOIRE-ONE-PAGE-GREENMAN-DIALOGS-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload 2.7.11 audit
        uses: actions/upload-artifact@v4
        with:
          name: GREENMAN-HEDGEWITCHERY-2-7-11-GRIMOIRE-ONE-PAGE-GREENMAN-DIALOGS-AUDIT
          path: |
            ${{ runner.temp }}/GREENMAN_27_APK_SHA256.txt
            ${{ runner.temp }}/GREENMAN_27_BADGING.txt
            ${{ runner.temp }}/GREENMAN_27_EXPECTED.html
            ${{ runner.temp }}/GREENMAN_NATIVE_PRINT_BRIDGE.js
            ${{ runner.temp }}/GREENMAN_2_7_11_ONE_PAGE_DIALOG_PROOF.txt
            ${{ runner.temp }}/GREENMAN_2_7_11_APK_CERT.txt
            ${{ runner.temp }}/GREENMAN_2_7_11_SIGNING_PROOF.txt
            ${{ runner.temp }}/GREENMAN_2_7_11_JAVA_SHA256.txt
            clean_shell_v2/force_stable_debug_signing.py
            clean_shell_v2/install_single_grimoire_dialogs_2711.py
            clean_shell_v2/install_final_tightening.py
            clean_shell_v2/install_print_layout_277.py
            clean_shell_v2/install_bos_snapshot_recovery_278.py
            clean_shell_v2/install_print_font_assets.py
            clean_shell_v2/install_pdf_hardened_names.py
            clean_shell_v2/build_2_7_final_candidate_ci.sh
          if-no-files-found: error
          retention-days: 30
