name: GREENMAN 2.7.4 PDF LIGHT + NAMES - INSPECTABLE

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-final-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out final-candidate branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install stable Greenman signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode "$GITHUB_WORKSPACE/tools/greenman_debug_keystore.b64" > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Build and audit 2.7.4 PDF light + names
        shell: bash
        run: bash "$GITHUB_WORKSPACE/clean_shell_v2/build_2_7_final_candidate_ci.sh"

      - name: Upload 2.7.4 APK
        uses: actions/upload-artifact@v4
        with:
          name: GREENMAN-HEDGEWITCHERY-2-7-4-PDF-LIGHT-NAMES-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload 2.7.4 audit
        uses: actions/upload-artifact@v4
        with:
          name: GREENMAN-HEDGEWITCHERY-2-7-4-PDF-LIGHT-NAMES-AUDIT
          path: |
            ${{ runner.temp }}/GREENMAN_27_APK_SHA256.txt
            ${{ runner.temp }}/GREENMAN_27_BADGING.txt
            ${{ runner.temp }}/GREENMAN_27_EXPECTED.html
            ${{ runner.temp }}/GREENMAN_2_7_4_JAVA_SHA256.txt
            ${{ runner.temp }}/MainActivity_2_7_4_PDF_LIGHT_NAMES.java
            clean_shell_v2/install_final_tightening.py
            clean_shell_v2/install_pdf_lightweight_names.py
            clean_shell_v2/build_2_7_final_candidate_ci.sh
          if-no-files-found: error
          retention-days: 30
