name: Build Clean HedgeWitchery Stocktake V8

on:
  push:
    branches:
      - standalone/stocktake-v8-clean-native
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out clean Stocktake branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare corrected V8 Stocktake HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stocktake-clean/app/src/main/assets

          python tools/normalize_stocktake_v6_for_v7.py \
            stocktake/GREENMAN_HEDGEWITCHERY_APOTHECARY_STOCKTAKE_CORRECT_V8.html \
            "$RUNNER_TEMP/stocktake-v8-normalized.html"

          python tools/patch_stocktake_v8_cloud_connections.py \
            "$RUNNER_TEMP/stocktake-v8-normalized.html" \
            stocktake-clean/app/src/main/assets/index.html

          grep -Fq 'gm-stocktake-v8-cloud-connections' stocktake-clean/app/src/main/assets/index.html
          grep -Fq 'CONNECT / SYNC STALL' stocktake-clean/app/src/main/assets/index.html
          grep -Fq 'SEND THIS STOCKTAKE ONLINE' stocktake-clean/app/src/main/assets/index.html
          grep -Fq 'SYNC ONLINE' stocktake-clean/app/src/main/assets/index.html

          if grep -Eq 'WildwoodBridge|GMStockBridge|WILDWOOD_STOCK_BRIDGE|WildwoodStockProvider' stocktake-clean/app/src/main/assets/index.html; then
            echo "Native bridge marker found in clean Stocktake HTML"
            exit 1
          fi

      - name: Build clean standalone Stocktake APK
        working-directory: stocktake-clean
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Align and sign with dedicated fresh Stocktake certificate
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"

          SIGN_PASS="$(python - <<'PY'
          import pathlib,re
          s=pathlib.Path('.github/workflows/build-full-access-gate-test-apk.yml').read_text()
          m=re.search(r'--ks-pass pass:([^\s\\]+)',s)
          if not m: raise SystemExit('release signing password source not found')
          print(m.group(1))
          PY
          )"

          base64 --decode stocktake-clean/stocktake_release_keystore.b64 > "$RUNNER_TEMP/stocktake-release.jks"
          chmod 600 "$RUNNER_TEMP/stocktake-release.jks"

          "$BT/zipalign" -p -f 4 \
            stocktake-clean/app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/HEDGEWITCHERY_STOCKTAKE_V8_CLEAN_aligned.apk"

          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/stocktake-release.jks" \
            --ks-key-alias stocktake2026 \
            --ks-pass "pass:$SIGN_PASS" \
            --key-pass "pass:$SIGN_PASS" \
            --out "$RUNNER_TEMP/HEDGEWITCHERY_STOCKTAKE_V8_CLEAN_FRESH_KEY_run${{ github.run_number }}.apk" \
            "$RUNNER_TEMP/HEDGEWITCHERY_STOCKTAKE_V8_CLEAN_aligned.apk"

      - name: Verify clean package certificate and icon
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          APK="$RUNNER_TEMP/HEDGEWITCHERY_STOCKTAKE_V8_CLEAN_FRESH_KEY_run${{ github.run_number }}.apk"

          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/stocktake-clean-sign.txt"
          "$BT/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/stocktake-clean-badging.txt"

          grep -q "package: name='com.greenman.hedgewitchery.stocktake'" "$RUNNER_TEMP/stocktake-clean-badging.txt"
          grep -q "application-label:'HedgeWitchery Stocktake'" "$RUNNER_TEMP/stocktake-clean-badging.txt"
          grep -q 'Signer #1 certificate SHA-256 digest: c1b6108a7cf4cb224ad987d7b2435df91f84d39e5de06d185bf01725cec92094' "$RUNNER_TEMP/stocktake-clean-sign.txt"

          if grep -q '3ffb1aea27cf9c3ec0ff8a0e6242e1f0118dd4869bfd0430ecdd9fdbba5f460e' "$RUNNER_TEMP/stocktake-clean-sign.txt"; then
            echo "Main app signing certificate leaked into clean Stocktake"
            exit 1
          fi

          unzip -p "$APK" assets/index.html > "$RUNNER_TEMP/stocktake-clean-index.html"
          grep -Fq 'gm-stocktake-v8-cloud-connections' "$RUNNER_TEMP/stocktake-clean-index.html"
          grep -Fq 'GM_STOCKTAKE_STALL_SYNC' "$RUNNER_TEMP/stocktake-clean-index.html"
          grep -Fq 'GM_STOCKTAKE_SYNC_ONLINE' "$RUNNER_TEMP/stocktake-clean-index.html"

          sha256sum "$APK" | tee "$RUNNER_TEMP/stocktake-clean-sha256.txt"

      - name: Upload clean Stocktake V8 APK
        uses: actions/upload-artifact@v4
        with:
          name: HEDGEWITCHERY-STOCKTAKE-V8-CLEAN-FRESH-KEY-run${{ github.run_number }}
          path: ${{ runner.temp }}/HEDGEWITCHERY_STOCKTAKE_V8_CLEAN_FRESH_KEY_run${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload clean Stocktake audit
        uses: actions/upload-artifact@v4
        with:
          name: HEDGEWITCHERY-STOCKTAKE-V8-CLEAN-AUDIT
          path: |
            ${{ runner.temp }}/stocktake-clean-sign.txt
            ${{ runner.temp }}/stocktake-clean-badging.txt
            ${{ runner.temp }}/stocktake-clean-sha256.txt
          if-no-files-found: error
          retention-days: 30
