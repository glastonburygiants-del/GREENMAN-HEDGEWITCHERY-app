name: Build HedgeWitchery Access Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - standalone/hedgewitchery-access-test
    paths:
      - "ACCESS_TEST_BUILD_TRIGGER.txt"

permissions:
  contents: read

jobs:
  build-access-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Access Test branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install same test signing key as the working Key Maker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode "$GITHUB_WORKSPACE/tools/greenman_debug_keystore.b64" > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Build standalone Access Test APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/access-test-android"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify standalone Access Test APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/access-test-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK_FILE=$APK" >> "$GITHUB_ENV"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/access_test_badging.txt"
          grep -q "package: name='com.greenman.hedgewitchery.accesstest'" "$RUNNER_TEMP/access_test_badging.txt"
          grep -q "application-label:'HedgeWitchery Access Test'" "$RUNNER_TEMP/access_test_badging.txt"
          sha256sum "$APK"

      - name: Upload HedgeWitchery Access Test APK
        uses: actions/upload-artifact@v4
        with:
          name: HEDGEWITCHERY-ACCESS-TEST-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 30
