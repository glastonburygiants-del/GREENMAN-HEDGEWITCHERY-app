name: Inspect Greenman V39 APK for Separate Preview
on:
  push:
    branches: [design/bos-manuscript-v39-safe]
    paths: [.github/workflows/inspect-bos-preview-manifest.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download verified V39 source APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v39-original"
          gh run download 43040222231 --repo "$GITHUB_REPOSITORY" --name GREENMAN-HEDGEWITCHERY-APOTHECARY-FV3-APK-run194 --dir "$RUNNER_TEMP/v39-original"
          SOURCE="$RUNNER_TEMP/v39-original/GREENMAN_HEDGEWITCHERY_APOTHECARY_FV3_run194.apk"
          echo "4d367a7601cbb2fdb9b70baabb521a16f056c9fa90db52e74f7aa4540dccee47  $SOURCE" | sha256sum -c -
          echo "SOURCE=$SOURCE" >> "$GITHUB_ENV"
      - name: Decode and inspect manifest only
        run: |
          set -euo pipefail
          curl --fail -L -sS -o "$RUNNER_TEMP/apktool.jar" https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          java -jar "$RUNNER_TEMP/apktool.jar" d -f "$SOURCE" -o "$RUNNER_TEMP/decoded"
          python - "$RUNNER_TEMP/decoded/AndroidManifest.xml" <<'PY'
          import sys,re,xml.etree.ElementTree as ET
          s=open(sys.argv[1],encoding='utf-8').read()
          print('MANIFEST HEAD:',s[:1500])
          root=ET.fromstring(s); ns='{http://schemas.android.com/apk/res/android}'
          print('PACKAGE',root.attrib.get('package'))
          print('PERMISSIONS',[(x.tag,x.attrib.get(ns+'name')) for x in root if 'permission' in x.tag])
          for node in root.iter():
            if node.tag in {'application','activity','service','receiver','provider','activity-alias'}:
              print('COMPONENT',node.tag,[(k.split('}')[-1],v) for k,v in node.attrib.items() if k.split('}')[-1] in {'name','label','authorities','process','permission','targetActivity','exported','taskAffinity'}])
          PY
