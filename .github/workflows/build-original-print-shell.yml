name: Build Greenman Original Print Shell

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out test branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install stable signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode tools/greenman_debug_keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Unpack protected clean app
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'GREENMAN_HEDGEWITCHERY_ANDROID_PROJECT_GATHER_FIXED*.zip' -print -quit)"
          test -s "$ZIP_FILE"
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR="$(find extracted -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify untouched original app HTML
        shell: bash
        run: |
          set -euo pipefail
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"
          echo "90dd2304a3292124893ab2dba441762d1eb84b08173cf5e329bf0e04998618ef  $INDEX_FILE" | sha256sum -c -

      - name: Restore verified clean shell
        shell: bash
        run: |
          set -euo pipefail
          JAVA_FILE="$PROJECT_DIR/app/src/main/java/com/greenman/hedgewitchery/MainActivity.java"
          : > "$JAVA_FILE"
          for part in \
            clean_shell/MainActivity.chunk01.b64 \
            clean_shell/MainActivity.chunk02.b64 \
            clean_shell/MainActivity.tail01.b64 \
            clean_shell/MainActivity.tail02.b64 \
            clean_shell/MainActivity.tail03.b64; do
            base64 --decode "$part" >> "$JAVA_FILE"
          done
          echo "57d87d78d803623d5cc5f2227f16563899d0b5038d7d49b33327c1359e0ee771  $JAVA_FILE" | sha256sum -c -

      - name: Apply phone-test print gate correction
        shell: bash
        run: |
          set -euo pipefail
          JAVA_FILE="$PROJECT_DIR/app/src/main/java/com/greenman/hedgewitchery/MainActivity.java"
          python3 clean_shell/patch_print_internal_schemes.py "$JAVA_FILE"
          grep -q '"data".equalsIgnoreCase(scheme)' "$JAVA_FILE"
          grep -q '"about".equalsIgnoreCase(scheme)' "$JAVA_FILE"
          grep -q '"blob".equalsIgnoreCase(scheme)' "$JAVA_FILE"
          grep -q "root.addView(target, 0, layout)" "$JAVA_FILE"
          grep -q "MediaSize.ISO_A4" "$JAVA_FILE"
          cp "$JAVA_FILE" "$RUNNER_TEMP/MainActivity.java"
          sha256sum "$JAVA_FILE" > "$RUNNER_TEMP/GREENMAN_1_8_JAVA_SHA256.txt"
          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 9/' "$PROJECT_DIR/app/build.gradle"
          sed -i -E 's/versionName[[:space:]]+"[^"]+"/versionName "1.8-print-gate"/' "$PROJECT_DIR/app/build.gradle"

      - name: Recheck original HTML after shell edit
        shell: bash
        run: |
          set -euo pipefail
          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"
          echo "90dd2304a3292124893ab2dba441762d1eb84b08173cf5e329bf0e04998618ef  $INDEX_FILE" | sha256sum -c -

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name 'app-debug.apk' -print -quit)"
          test -s "$APK_FILE"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          sha256sum "$APK_FILE" > "$RUNNER_TEMP/GREENMAN_1_8_APK_SHA256.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK_FILE" > "$RUNNER_TEMP/GREENMAN_1_8_BADGING.txt"
          grep -q "package: name='com.greenman.hedgewitchery' versionCode='9'" "$RUNNER_TEMP/GREENMAN_1_8_BADGING.txt"
          grep -q "application-label:'Greenman HedgeWitchery'" "$RUNNER_TEMP/GREENMAN_1_8_BADGING.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GREENMAN-HEDGEWITCHERY-1-8-PRINT-GATE-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: GREENMAN-HEDGEWITCHERY-1-8-PRINT-GATE-AUDIT
          path: |
            ${{ runner.temp }}/MainActivity.java
            ${{ runner.temp }}/GREENMAN_1_8_JAVA_SHA256.txt
            ${{ runner.temp }}/GREENMAN_1_8_APK_SHA256.txt
            ${{ runner.temp }}/GREENMAN_1_8_BADGING.txt
            clean_shell/patch_print_internal_schemes.py
          if-no-files-found: error
          retention-days: 30
