name: Build Current Greenman From V28 Android Base

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-v24-bind-storage-apk.yml"
      - "current-build-20260907/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository with V28 history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Reconstruct exact current HTML
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/gm-v28-current"
          mkdir -p "$WORK"
          BASE="$GITHUB_WORKSPACE/GREENMAN_HEDGEWITCHERY.apk"
          PACKED="$GITHUB_WORKSPACE/GREENMAN_V23_ENERGY_HEADING_V19_MINIMAL_SAFE.html.xz (1).html"

          test "$(stat -c%s "$BASE")" -eq 6690801
          echo "a3e5f03bbd5560b7420626ec02b0c89ff0252a35200a650b9e8ea950bb2e2cdd  $BASE" | sha256sum -c -

          xz --test "$PACKED"
          xz --decompress --stdout "$PACKED" > "$WORK/v23.html"
          echo "b02e6e2cc69f9239bdf5a4490cd1159b7b6edcdecfc98461a5a49ed034074d59  $WORK/v23.html" | sha256sum -c -

          python tools/patch_bos_last_bound.py "$WORK/v23.html" "$WORK/v29-base.html"
          echo "10fe161dba2deb807d3a82945c0f3b5e8f044fd0219d3bc1d7432ed3b2854192  $WORK/v29-base.html" | sha256sum -c -

          command -v zstd >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y zstd
          }
          cat "$GITHUB_WORKSPACE"/current-build-20260907/fixed_patch.part*.b64 > "$WORK/current.patch.b64"
          base64 --decode "$WORK/current.patch.b64" > "$WORK/current.patch.zst"
          echo "a6b79af8ed2c7920e7828a6d3f197e2f407601e627a2108a1fc84c966a959399  $WORK/current.patch.zst" | sha256sum -c -
          zstd -d --patch-from="$WORK/v29-base.html" "$WORK/current.patch.zst" -o "$WORK/current.html"
          test "$(stat -c%s "$WORK/current.html")" -eq 32014264
          echo "f8892e796724498ca663e1618933ba82d3f5aebca2aa7cbdfe00eec31ffd7b35  $WORK/current.html" | sha256sum -c -

          echo "WORK=$WORK" >> "$GITHUB_ENV"

      - name: Restore exact V28 native files
        shell: bash
        run: |
          set -euo pipefail
          git show 44e113dac3b6e9bb3c2f8aeac07b9dad0b0d39da:tools/BoundBookStore.java > "$WORK/BoundBookStore.java"
          git show 44e113dac3b6e9bb3c2f8aeac07b9dad0b0d39da:tools/patch_register_bound_store.py > "$WORK/patch_register_bound_store.py"

      - name: Compile V28 BoundBookStore only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK/helper-classes" "$WORK/helper-dex"
          javac -source 8 -target 8             -cp "$ANDROID_HOME/platforms/android-35/android.jar"             -d "$WORK/helper-classes"             "$WORK/BoundBookStore.java"
          "$ANDROID_HOME/build-tools/35.0.0/d8"             --min-api 29             --output "$WORK/helper-dex"             "$WORK/helper-classes/com/greenman/hedgewitchery/BoundBookStore.class"

      - name: Decode shell and install current HTML on V28 base
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --show-error --silent             -o "$WORK/apktool.jar"             https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          java -jar "$WORK/apktool.jar" d -f             "$GITHUB_WORKSPACE/GREENMAN_HEDGEWITCHERY.apk"             -o "$WORK/decoded"

          python "$WORK/patch_register_bound_store.py"             "$WORK/decoded/smali_classes2/com/greenman/hedgewitchery/MainActivity.smali"

          cp "$WORK/current.html" "$WORK/decoded/assets/index.html"
          sed -i 's/versionCode: 30/versionCode: 42/' "$WORK/decoded/apktool.yml"
          sed -i 's/versionName: .*/versionName: 2.7.24/' "$WORK/decoded/apktool.yml"

          if grep -Fq 'ScribePdfService' "$WORK/decoded/AndroidManifest.xml"; then exit 1; fi
          if grep -Fq 'android.permission.FOREGROUND_SERVICE' "$WORK/decoded/AndroidManifest.xml"; then exit 1; fi
          if grep -Fq 'android:process=":bosrender"' "$WORK/decoded/AndroidManifest.xml"; then exit 1; fi

      - name: Add V28 helper class
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK/helper-apk"
          unzip -p "$GITHUB_WORKSPACE/GREENMAN_HEDGEWITCHERY.apk" AndroidManifest.xml > "$WORK/helper-apk/AndroidManifest.xml"
          cp "$WORK/helper-dex/classes.dex" "$WORK/helper-apk/classes.dex"
          cd "$WORK/helper-apk"
          zip -q "$WORK/helper.apk" AndroidManifest.xml classes.dex

          java -jar "$WORK/apktool.jar" d -f -r "$WORK/helper.apk" -o "$WORK/helper-decoded"
          HELPER_SMALI="$(find "$WORK/helper-decoded" -type f -name 'BoundBookStore.smali' -print -quit)"
          test -n "$HELPER_SMALI"
          mkdir -p "$WORK/decoded/smali_classes3/com/greenman/hedgewitchery"
          cp "$HELPER_SMALI" "$WORK/decoded/smali_classes3/com/greenman/hedgewitchery/BoundBookStore.smali"

          grep -Fq 'beginLastBoundPdf' "$WORK/decoded/smali_classes3/com/greenman/hedgewitchery/BoundBookStore.smali"
          grep -Fq 'exportLastBoundPdf' "$WORK/decoded/smali_classes3/com/greenman/hedgewitchery/BoundBookStore.smali"

      - name: Build align and sign
        shell: bash
        run: |
          set -euo pipefail
          java -jar "$WORK/apktool.jar" b "$WORK/decoded" -o "$WORK/unsigned.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -p -f 4 "$WORK/unsigned.apk" "$WORK/aligned.apk"

          mkdir -p "$HOME/.android"
          base64 --decode tools/greenman_debug_keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

          "$BT/apksigner" sign             --ks "$HOME/.android/debug.keystore"             --ks-key-alias androiddebugkey             --ks-pass pass:android             --key-pass pass:android             --out "$RUNNER_TEMP/GREENMAN_HEDGEWITCHERY_APOTHECARY_FV_2.7.24.apk"             "$WORK/aligned.apk"

      - name: Verify V28-base APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/GREENMAN_HEDGEWITCHERY_APOTHECARY_FV_2.7.24.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"

          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee "$WORK/apksigner.txt"
          "$BT/zipalign" -c -v 4 "$APK" >/dev/null
          "$BT/aapt" dump badging "$APK" | tee "$WORK/badging.txt"

          grep -q "package: name='com.greenman.hedgewitchery' versionCode='41'" "$WORK/badging.txt"
          unzip -p "$APK" assets/index.html > "$WORK/final-index.html"
          cmp "$WORK/final-index.html" "$WORK/current.html"
          echo "f8892e796724498ca663e1618933ba82d3f5aebca2aa7cbdfe00eec31ffd7b35  $WORK/final-index.html" | sha256sum -c -

          unzip -p "$APK" classes3.dex | strings | grep -Fq 'Greenman_Last_Bound_Book.pdf'
          if unzip -p "$APK" classes3.dex | strings | grep -Fq 'ScribePdfService'; then exit 1; fi
          if unzip -p "$APK" AndroidManifest.xml | strings | grep -Fq 'FOREGROUND_SERVICE'; then exit 1; fi

          sha256sum "$APK" | tee "$WORK/final-apk-sha256.txt"

      - name: Upload V28-base APK
        uses: actions/upload-artifact@v4
        with:
          name: GREENMAN-HEDGEWITCHERY-APOTHECARY-FV-2.7.24-APK
          path: ${{ runner.temp }}/GREENMAN_HEDGEWITCHERY_APOTHECARY_FV_2.7.24.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: GREENMAN-HEDGEWITCHERY-APOTHECARY-FV-2.7.24-AUDIT
          path: |
            ${{ runner.temp }}/gm-v28-current/apksigner.txt
            ${{ runner.temp }}/gm-v28-current/badging.txt
            ${{ runner.temp }}/gm-v28-current/final-apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
