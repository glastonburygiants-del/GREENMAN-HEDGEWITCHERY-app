name: Build V29 Android 10 Proven BoS and Scribe APK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-v24-bind-storage-apk.yml"
      - "tools/BoundBookStore.java"
      - "tools/ScribePdfService.java"
      - "tools/patch_bos_last_bound.py"
      - "tools/patch_register_bound_store.py"
      - "tools/patch_register_scribe_service.py"
      - "tools/verify_bos_v29.js"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out canonical repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify exact V5.1 APK shell and V23 source
        shell: bash
        run: |
          set -euo pipefail
          BASE="$GITHUB_WORKSPACE/GREENMAN_HEDGEWITCHERY.apk"
          PACKED="$GITHUB_WORKSPACE/GREENMAN_V23_ENERGY_HEADING_V19_MINIMAL_SAFE.html.xz (1).html"
          test "$(stat -c%s "$BASE")" -eq 6690801
          echo "a3e5f03bbd5560b7420626ec02b0c89ff0252a35200a650b9e8ea950bb2e2cdd  $BASE" | sha256sum -c -
          test "$(stat -c%s "$PACKED")" -eq 6710820
          xz --test "$PACKED"
          mkdir -p "$RUNNER_TEMP/gm-v24"
          xz --decompress --stdout "$PACKED" > "$RUNNER_TEMP/gm-v24/v23.html"
          test "$(stat -c%s "$RUNNER_TEMP/gm-v24/v23.html")" -eq 30992156
          echo "b02e6e2cc69f9239bdf5a4490cd1159b7b6edcdecfc98461a5a49ed034074d59  $RUNNER_TEMP/gm-v24/v23.html" | sha256sum -c -

      - name: Patch the consolidated BoS and Scribe background route
        shell: bash
        run: |
          set -euo pipefail
          python tools/patch_bos_last_bound.py \
            "$RUNNER_TEMP/gm-v24/v23.html" \
            "$RUNNER_TEMP/gm-v24/v29.html"
          test "$(stat -c%s "$RUNNER_TEMP/gm-v24/v29.html")" -eq 31037700
          echo "10fe161dba2deb807d3a82945c0f3b5e8f044fd0219d3bc1d7432ed3b2854192  $RUNNER_TEMP/gm-v24/v29.html" | sha256sum -c -
          grep -Fq "BoS Text Conversion" "$RUNNER_TEMP/gm-v24/v29.html"
          grep -Fq "startNativeConversion" "$RUNNER_TEMP/gm-v24/v29.html"
          grep -Fq "beginPdfPage" "$RUNNER_TEMP/gm-v24/v29.html"
          grep -Fq "gm_scribe_bos_bound_catalog_v2" "$RUNNER_TEMP/gm-v24/v29.html"
          grep -Fq "Only the current PDF for each chosen hand is kept." "$RUNNER_TEMP/gm-v24/v29.html"
          grep -Fq "Choose Scribe Text" "$RUNNER_TEMP/gm-v24/v29.html"
          grep -Fq "Chapter Contents" "$RUNNER_TEMP/gm-v24/v29.html"
          if grep -Fq 'id=\"gmInkExportLastBoundBtn\"' "$RUNNER_TEMP/gm-v24/v29.html"; then
            echo "Duplicate legacy export control remains" >&2
            exit 1
          fi
          node tools/verify_bos_v29.js \
            "$RUNNER_TEMP/gm-v24/v23.html" \
            "$RUNNER_TEMP/gm-v24/v29.html"

      - name: Compile the native store and isolated page renderer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gm-v24/helper-classes" "$RUNNER_TEMP/gm-v24/helper-dex"
          javac -source 8 -target 8 \
            -cp "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d "$RUNNER_TEMP/gm-v24/helper-classes" \
            tools/BoundBookStore.java \
            tools/ScribePdfService.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" \
            --min-api 26 \
            --output "$RUNNER_TEMP/gm-v24/helper-dex" \
            $(find "$RUNNER_TEMP/gm-v24/helper-classes" -type f -name '*.class' -print)

      - name: Decode exact shell and register the native bridge and service
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --show-error --silent \
            -o "$RUNNER_TEMP/gm-v24/apktool.jar" \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          java -jar "$RUNNER_TEMP/gm-v24/apktool.jar" d -f \
            "$GITHUB_WORKSPACE/GREENMAN_HEDGEWITCHERY.apk" \
            -o "$RUNNER_TEMP/gm-v24/decoded"
          python tools/patch_register_bound_store.py \
            "$RUNNER_TEMP/gm-v24/decoded/smali_classes2/com/greenman/hedgewitchery/MainActivity.smali"
          python tools/patch_register_scribe_service.py \
            "$RUNNER_TEMP/gm-v24/decoded/AndroidManifest.xml"
          cp "$RUNNER_TEMP/gm-v24/v29.html" "$RUNNER_TEMP/gm-v24/decoded/assets/index.html"
          sed -i 's/minSdkVersion: 29/minSdkVersion: 26/' "$RUNNER_TEMP/gm-v24/decoded/apktool.yml"
          sed -i 's/versionCode: 30/versionCode: 2902/' "$RUNNER_TEMP/gm-v24/decoded/apktool.yml"
          sed -i 's/versionName: .*/versionName: 2.7.20-android10-update/' "$RUNNER_TEMP/gm-v24/decoded/apktool.yml"
          grep -Fq 'minSdkVersion: 26' "$RUNNER_TEMP/gm-v24/decoded/apktool.yml"
          grep -Fq 'versionCode: 2902' "$RUNNER_TEMP/gm-v24/decoded/apktool.yml"
          grep -Fq 'com.greenman.hedgewitchery.ScribePdfService' "$RUNNER_TEMP/gm-v24/decoded/AndroidManifest.xml"
          grep -Fq 'android:process=":bosrender"' "$RUNNER_TEMP/gm-v24/decoded/AndroidManifest.xml"

      - name: Convert all helper DEX classes to added Smali classes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gm-v24/helper-apk"
          unzip -p "$GITHUB_WORKSPACE/GREENMAN_HEDGEWITCHERY.apk" AndroidManifest.xml \
            > "$RUNNER_TEMP/gm-v24/helper-apk/AndroidManifest.xml"
          cp "$RUNNER_TEMP/gm-v24/helper-dex/classes.dex" "$RUNNER_TEMP/gm-v24/helper-apk/classes.dex"
          cd "$RUNNER_TEMP/gm-v24/helper-apk"
          zip -q "$RUNNER_TEMP/gm-v24/helper.apk" AndroidManifest.xml classes.dex
          java -jar "$RUNNER_TEMP/gm-v24/apktool.jar" d -f -r \
            "$RUNNER_TEMP/gm-v24/helper.apk" \
            -o "$RUNNER_TEMP/gm-v24/helper-decoded"
          HELPER_ROOT="$(find "$RUNNER_TEMP/gm-v24/helper-decoded" -type d -path '*/com/greenman/hedgewitchery' -print -quit)"
          test -n "$HELPER_ROOT"
          mkdir -p "$RUNNER_TEMP/gm-v24/decoded/smali_classes3/com/greenman/hedgewitchery"
          cp -R "$HELPER_ROOT/." "$RUNNER_TEMP/gm-v24/decoded/smali_classes3/com/greenman/hedgewitchery/"
          grep -Fq 'beginLastBoundPdf' "$RUNNER_TEMP/gm-v24/decoded/smali_classes3/com/greenman/hedgewitchery/BoundBookStore.smali"
          grep -Fq 'beginPdfJob' "$RUNNER_TEMP/gm-v24/decoded/smali_classes3/com/greenman/hedgewitchery/BoundBookStore.smali"
          grep -Fq 'exportBookPdf' "$RUNNER_TEMP/gm-v24/decoded/smali_classes3/com/greenman/hedgewitchery/BoundBookStore.smali"
          grep -Fq 'RENDER_SCRIBE_PDF' "$RUNNER_TEMP/gm-v24/decoded/smali_classes3/com/greenman/hedgewitchery/ScribePdfService.smali"

      - name: Rebuild align and sign
        shell: bash
        run: |
          set -euo pipefail
          java -jar "$RUNNER_TEMP/gm-v24/apktool.jar" b \
            "$RUNNER_TEMP/gm-v24/decoded" \
            -o "$RUNNER_TEMP/gm-v24/unsigned.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -p -f 4 \
            "$RUNNER_TEMP/gm-v24/unsigned.apk" \
            "$RUNNER_TEMP/gm-v24/aligned.apk"
          mkdir -p "$HOME/.android"
          base64 --decode tools/greenman_debug_keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          "$BT/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$RUNNER_TEMP/GREENMAN_HEDGEWITCHERY_V29_ANDROID10_UPDATE.apk" \
            "$RUNNER_TEMP/gm-v24/aligned.apk"

      - name: Verify final APK and protected payload
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/GREENMAN_HEDGEWITCHERY_V29_ANDROID10_UPDATE.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK" \
            | tee "$RUNNER_TEMP/gm-v24/apksigner.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/gm-v24/apksigner.txt"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/gm-v24/apksigner.txt"
          grep -Fq "Signer #1 certificate SHA-256 digest: bd22a5c3ff7335237a0e725032816eb563d2e350789e6e555369b0fe32e0c19e" \
            "$RUNNER_TEMP/gm-v24/apksigner.txt"
          "$BT/zipalign" -c -v 4 "$APK" >/dev/null
          "$BT/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/gm-v24/badging.txt"
          grep -q "package: name='com.greenman.hedgewitchery' versionCode='2902'" "$RUNNER_TEMP/gm-v24/badging.txt"
          grep -q "sdkVersion:'26'" "$RUNNER_TEMP/gm-v24/badging.txt"
          unzip -p "$APK" assets/index.html > "$RUNNER_TEMP/gm-v24/final-index.html"
          cmp "$RUNNER_TEMP/gm-v24/final-index.html" "$RUNNER_TEMP/gm-v24/v29.html"
          unzip -p "$APK" classes3.dex | strings | grep -Fq 'Greenman_Last_Bound_Book.pdf'
          unzip -p "$APK" classes3.dex | strings | grep -Fq 'ScribePdfService'
          unzip -p "$APK" classes3.dex | strings | grep -Fq 'render-status.json'
          unzip -p "$APK" classes2.dex | strings | grep -Fq 'GreenmanFiles'
          for asset in greenman_bower.html greenman_scribe.html greenman_treehouse.html; do
            cmp \
              <(unzip -p "$GITHUB_WORKSPACE/GREENMAN_HEDGEWITCHERY.apk" "assets/$asset") \
              <(unzip -p "$APK" "assets/$asset")
          done
          sha256sum "$APK" | tee "$RUNNER_TEMP/gm-v24/final-apk-sha256.txt"

      - name: Prove V28 to V29 upgrade on Android 10
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p "$RUNNER_TEMP/gm-v24/v28"
            curl -L --fail --show-error --silent \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -o "$RUNNER_TEMP/gm-v24/v28.zip" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9961867914/zip"
            unzip -q "$RUNNER_TEMP/gm-v24/v28.zip" -d "$RUNNER_TEMP/gm-v24/v28"
            V28="$RUNNER_TEMP/gm-v24/v28/GREENMAN_HEDGEWITCHERY_V28_ISOLATED_BIND.apk"
            V29="$RUNNER_TEMP/GREENMAN_HEDGEWITCHERY_V29_ANDROID10_UPDATE.apk"
            adb install "$V28"
            adb install -r "$V29"
            adb shell dumpsys package com.greenman.hedgewitchery \
              | grep -F 'versionCode=2902'
            adb shell am start -W \
              -n com.greenman.hedgewitchery/.MainActivity \
              | tee "$RUNNER_TEMP/gm-v24/android10-launch.txt"
            grep -Fq 'Status: ok' "$RUNNER_TEMP/gm-v24/android10-launch.txt"

      - name: Upload V29 Android 10 proven APK
        uses: actions/upload-artifact@v4
        with:
          name: GREENMAN-V29-ANDROID10-PROVEN-APK
          path: ${{ runner.temp }}/GREENMAN_HEDGEWITCHERY_V29_ANDROID10_UPDATE.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload V29 Android 10 audit
        uses: actions/upload-artifact@v4
        with:
          name: GREENMAN-V29-ANDROID10-PROVEN-AUDIT
          path: |
            ${{ runner.temp }}/gm-v24/apksigner.txt
            ${{ runner.temp }}/gm-v24/badging.txt
            ${{ runner.temp }}/gm-v24/final-apk-sha256.txt
            ${{ runner.temp }}/gm-v24/android10-launch.txt
          if-no-files-found: error
          retention-days: 30
