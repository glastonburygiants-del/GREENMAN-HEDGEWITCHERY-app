name: Build Current Greenman From V28 Android Base

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-v24-bind-storage-apk.yml"
      - "current-build-20260907/**"
      - "tools/patch_inkpot_cupboard_final.py"
      - "tools/patch_v2729_hotfix.py"
      - "tools/patch_v2730_hotfix.py"
      - "tools/patch_v2731_cleanup.py"
      - "tools/patch_v2732_security.py.zst"
      - "tools/patch_v2733_recovery.py.zst"
      - "tools/patch_v2734_scribe_ui_print.py.zst"
      - "tools/patch_v2735_bos_zoom_contents.py.zst"
      - "tools/patch_v2736_select_everything.py.zst"
      - "tools/patch_v2737_home_contents.py.zst"
      - "tools/patch_fv3_tablet_home.py"
      - "tools/patch_fv3_followup_home_childsafe_fullwidth.py"
      - "tools/restore_fv3_scribe_direct_compact.part*.b64"
      - "tools/verify_inline_scripts.js"
      - "tools/patch_lazy_load_scribe.py"
      - "tools/force_resources_arsc_stored.py"
      - "tools/patch_immersive_mode_order.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository with V28 history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Reconstruct exact current HTML
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/gm-v28-current"
          mkdir -p "$WORK"
          BASE="$GITHUB_WORKSPACE/GREENMAN_HEDGEWITCHERY.apk"
          PACKED="$GITHUB_WORKSPACE/GREENMAN_V23_ENERGY_HEADING_V19_MINIMAL_SAFE.html.xz (1).html"

          test "$(stat -c%s "$BASE")" -eq 6690801
          echo "a3e5f03bbd5560b7420626ec02b0c89ff0252a35200a650b9e8ea950bb2e2cdd  $BASE" | sha256sum -c -

          xz --test "$PACKED"
          xz --decompress --stdout "$PACKED" > "$WORK/v23.html"
          echo "b02e6e2cc69f9239bdf5a4490cd1159b7b6edcdecfc98461a5a49ed034074d59  $WORK/v23.html" | sha256sum -c -

          python tools/patch_bos_last_bound.py "$WORK/v23.html" "$WORK/v29-base.html"
          echo "10fe161dba2deb807d3a82945c0f3b5e8f044fd0219d3bc1d7432ed3b2854192  $WORK/v29-base.html" | sha256sum -c -

          command -v zstd >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y zstd
          }
          PINNED_GOOD="7636651096b13596bbd692dd10dcd66d170159b0"
          : > "$WORK/current.patch.b64"
          for n in 00 01 02 03 04 05 06 07 08 09; do
            git show "$PINNED_GOOD:current-build-20260907/fixed_patch.part$n.b64" >> "$WORK/current.patch.b64"
          done
          base64 --decode "$WORK/current.patch.b64" > "$WORK/current.patch.zst"
          echo "4ba4964d0f9c0923d550a6e568d448a0f62db58b4a769902d3f35b30c46deeef  $WORK/current.patch.zst" | sha256sum -c -
          zstd -d --patch-from="$WORK/v29-base.html" "$WORK/current.patch.zst" -o "$WORK/pre-inkpot-fix.html"
          test "$(stat -c%s "$WORK/pre-inkpot-fix.html")" -eq 32037133
          echo "0d51455210168dee9c40a6a1c520789d6ee104e61ed1f3eebca2a91fe74a1318  $WORK/pre-inkpot-fix.html" | sha256sum -c -

          python tools/patch_inkpot_cupboard_final.py "$WORK/pre-inkpot-fix.html" "$WORK/current-2728.html"
          test "$(stat -c%s "$WORK/current-2728.html")" -eq 32059828
          echo "48a736add3abc2caf260b8fe97794e5f8d64759204c864b4e5e09d0388f7fb4e  $WORK/current-2728.html" | sha256sum -c -

          python tools/patch_v2729_hotfix.py "$WORK/current-2728.html" "$WORK/current-2729.html"
          test "$(stat -c%s "$WORK/current-2729.html")" -eq 32060705
          echo "b419178d8017ba188fa794019632b31fd14a2d6aa5705eec8b34212ebf9949cd  $WORK/current-2729.html" | sha256sum -c -

          python tools/patch_v2730_hotfix.py "$WORK/current-2729.html" "$WORK/current-2730.html"
          test "$(stat -c%s "$WORK/current-2730.html")" -eq 32057610
          echo "d5c2bee553055e2fa3d5356446de7e781b4a0ff14ae53d880aadcf5c27e80204  $WORK/current-2730.html" | sha256sum -c -

          python tools/patch_v2731_cleanup.py "$WORK/current-2730.html" "$WORK/current-2731.html"
          test "$(stat -c%s "$WORK/current-2731.html")" -eq 32015365
          echo "deb339a1982d3fd2c8df8f3b4e4cc247a223903c639e6c7f00c0bd69ac37599b  $WORK/current-2731.html" | sha256sum -c -

          zstd -d "$GITHUB_WORKSPACE/tools/patch_v2732_security.py.zst" -o "$WORK/patch_v2732_security.py"
          echo "682a26eaefbc3eebb8dadd4e1b6546e3702505eca14f6d21b30416cb3f292bcd  $WORK/patch_v2732_security.py" | sha256sum -c -
          python "$WORK/patch_v2732_security.py" "$WORK/current-2731.html" "$WORK/current-2732.html"
          test "$(stat -c%s "$WORK/current-2732.html")" -eq 32071303
          echo "8ed98c7fc141ee4e867b18146f2ea7fd05ef3d802238f75a16dbaa626ce29af5  $WORK/current-2732.html" | sha256sum -c -

          zstd -d "$GITHUB_WORKSPACE/tools/patch_v2733_recovery.py.zst" -o "$WORK/patch_v2733_recovery.py"
          echo "4c1226e3b5f675d9381fcdd5f94d19ab369d05d8d8300724744801b75782e2e0  $WORK/patch_v2733_recovery.py" | sha256sum -c -
          python "$WORK/patch_v2733_recovery.py" "$WORK/current-2732.html" "$WORK/current-2733.html"
          test "$(stat -c%s "$WORK/current-2733.html")" -eq 32076983
          echo "c269f4eccb9717bfaa95c5c9a49e19ed17f86088683eb84958650d4c73a39d96  $WORK/current-2733.html" | sha256sum -c -

          zstd -d "$GITHUB_WORKSPACE/tools/patch_v2734_scribe_ui_print.py.zst" -o "$WORK/patch_v2734_scribe_ui_print.py"
          echo "34a20d04f35371ca9fe61b807cfe281fcdb01b48443e17660f535a9c5689ec3b  $WORK/patch_v2734_scribe_ui_print.py" | sha256sum -c -
          python "$WORK/patch_v2734_scribe_ui_print.py" "$WORK/current-2733.html" "$WORK/current-2734.html"
          test "$(stat -c%s "$WORK/current-2734.html")" -eq 32086053
          echo "ae997b8b634f91151d797cabe2f340f6bf4ebe05414a4e1d3c163788a0f3a7b4  $WORK/current-2734.html" | sha256sum -c -

          zstd -d "$GITHUB_WORKSPACE/tools/patch_v2735_bos_zoom_contents.py.zst" -o "$WORK/patch_v2735_bos_zoom_contents.py"
          echo "f8a165e8d871d316e720461be746d84b36dbb93bb6bc66df04718c963a70712a  $WORK/patch_v2735_bos_zoom_contents.py" | sha256sum -c -
          python "$WORK/patch_v2735_bos_zoom_contents.py" "$WORK/current-2734.html" "$WORK/current-2735.html"
          test "$(stat -c%s "$WORK/current-2735.html")" -eq 32089842
          echo "61fe7fa7dc67d4100e68eecce41e3ef57a0695a9082d9bd72b586d62f0ca2a64  $WORK/current-2735.html" | sha256sum -c -

          zstd -d "$GITHUB_WORKSPACE/tools/patch_v2736_select_everything.py.zst" -o "$WORK/patch_v2736_select_everything.py"
          echo "fdf5b9233a776d46c340cca6c46a6db48b815bf7c5ef21fccdf4f913bd49e6d4  $WORK/patch_v2736_select_everything.py" | sha256sum -c -
          python "$WORK/patch_v2736_select_everything.py" "$WORK/current-2735.html" "$WORK/current-2736.html"
          test "$(stat -c%s "$WORK/current-2736.html")" -eq 32100370
          echo "cd6248c3ddd9c39c2049068b21da6b2845bc889b64b271495d6fffc764c70410  $WORK/current-2736.html" | sha256sum -c -

          zstd -d "$GITHUB_WORKSPACE/tools/patch_v2737_home_contents.py.zst" -o "$WORK/patch_v2737_home_contents.py"
          echo "92cd65507c61eb2137dcb870d6b30ce9269e21f42088ff7f1df2d594f7be36bc  $WORK/patch_v2737_home_contents.py" | sha256sum -c -
          python "$WORK/patch_v2737_home_contents.py" "$WORK/current-2736.html" "$WORK/current-2741.html"
          test "$(stat -c%s "$WORK/current-2741.html")" -eq 32104566
          echo "6a5ad006f114e7da14fb35a6984ae8f51c7c7af985476c7cd834ca4e404cb63c  $WORK/current-2741.html" | sha256sum -c -

          echo "b0073618f7f0c9a2833157ea79dcc11c9684742e9259325f026e62423a27306c  $GITHUB_WORKSPACE/tools/patch_fv3_tablet_home.py" | sha256sum -c -
          python tools/patch_fv3_tablet_home.py "$WORK/current-2741.html" "$WORK/current.html"
          test "$(stat -c%s "$WORK/current.html")" -eq 32109237
          echo "332797a6b8845f8a1786e156e6771b8cc881883e25149ce86480e93014636fe5  $WORK/current.html" | sha256sum -c -
          node tools/verify_inline_scripts.js "$WORK/current.html"

          python tools/patch_fv3_followup_home_childsafe_fullwidth.py "$WORK/current.html" "$WORK/current-followup.html"
          mv "$WORK/current-followup.html" "$WORK/current.html"
          : > "$WORK/restore_fv3_scribe_direct.py.zst.b64"
          for n in 00 01 02 03 04 05 06 07 08 09 10 11 12 13; do
            cat "$GITHUB_WORKSPACE/tools/restore_fv3_scribe_direct_compact.part$n.b64" >> "$WORK/restore_fv3_scribe_direct.py.zst.b64"
          done
          test "$(stat -c%s "$WORK/restore_fv3_scribe_direct.py.zst.b64")" -eq 51484
          echo "2796eaa0a8292583e7907cecc0b209077f09e62cb9f68db67bb75e77ddbb53aa  $WORK/restore_fv3_scribe_direct.py.zst.b64" | sha256sum -c -
          base64 --decode "$WORK/restore_fv3_scribe_direct.py.zst.b64" > "$WORK/restore_fv3_scribe_direct.py.zst"
          echo "1f98b8af6f16fd0fd369c8eff4e158829a205c4634e6a9c4dc2266b837c592b6  $WORK/restore_fv3_scribe_direct.py.zst" | sha256sum -c -
          zstd -d "$WORK/restore_fv3_scribe_direct.py.zst" -o "$WORK/restore_fv3_scribe_direct.py"
          echo "c3effab71f41436037b4106fb1a9bb373db5714fb901678c6b5fe7a6e360a1b9  $WORK/restore_fv3_scribe_direct.py" | sha256sum -c -
          python "$WORK/restore_fv3_scribe_direct.py" "$WORK/current.html" "$WORK/current-scribe-restored.html"
          mv "$WORK/current-scribe-restored.html" "$WORK/current.html"

          test -s "$WORK/current.html"
          sha256sum "$WORK/current.html" | tee "$WORK/current-html-sha256.txt"
          node tools/verify_inline_scripts.js "$WORK/current.html"
          grep -Fq 'gm-fv3-child-safe-master-v2' "$WORK/current.html"
          grep -Fq 'GM_CUPBOARD_CHILD_BAD' "$WORK/current.html"
          if grep -Fq 'Math.round(stableHeight*9/16)' "$WORK/current.html"; then exit 1; fi

          python - "$WORK/current.html" <<'PY'
          import base64, json, re, sys
          app = open(sys.argv[1], encoding="utf-8").read()
          marker = "PAGES.scribe = "
          start = app.index(marker) + len(marker)
          scribe, _ = json.JSONDecoder().raw_decode(app[start:])

          for token in (
              "Sanskrit_Devanagari",
              "Sumerian_Cuneiform",
              "GM_SCRIBE_PRIVACY_V=3",
              "GM_SCRIBE_RECOVERY",
              "gmScribePrivacyDialog",
              "renderInkScribePrint",
          ):
              assert token in scribe, f"missing preserved/restored Scribe marker: {token}"

          for token in (
              "Language Packs",
              ".argosmodel",
              "GM_TRANSLATION_INDEX",
              "gm_scribe_language_pack_state_v2",
              "Translator engine:",
              "native language-model runtime",
              "Classic_Maya",
          ):
              assert token not in scribe, f"unwanted Scribe translator/Maya marker remains: {token}"

          match = re.search(r'const DESK_B64="([A-Za-z0-9+/=]+)"', scribe)
          assert match, "Scribe desk payload not found"
          desk = base64.b64decode(match.group(1)).decode("utf-8")

          def read_json(mark):
              pos = desk.index(mark) + len(mark)
              return json.JSONDecoder().raw_decode(desk[pos:])[0]

          rules = read_json("const SCRIPT_RULES=")
          targets = read_json("const TARGETS=")
          order = read_json("ORDER=")
          expected = [
              "Ugaritic", "Hieratic", "Demotic", "Sanskrit_Devanagari",
              "Sumerian_Cuneiform", "Hebrew", "Greek", "Elder_Futhark",
              "Anglo_Saxon_Futhorc", "Ogham", "Pictish", "Theban",
              "Chaldean", "Malachim", "Magi", "Celestial", "Passing_River",
              "Masonic", "Tengwar", "Angerthas"
          ]
          assert order == expected, order
          assert list(rules) == expected, list(rules)
          assert list(targets) == expected, list(targets)
          assert len(rules) == 20 and len(targets) == 20

          assert rules["Ogham"]["direction"] == "btt"
          for sid in ("Hebrew", "Hieratic", "Demotic"):
              assert rules[sid]["direction"] == "rtl", (sid, rules[sid])
          for sid in ("Ugaritic", "Greek", "Sanskrit_Devanagari", "Sumerian_Cuneiform"):
              assert rules[sid]["direction"] == "ltr", (sid, rules[sid])

          for token in (
              "GM_LANGUAGE_TRANSLATION_ENABLED",
              "renderRuntimeNeeded",
              "renderControlledUgaritic",
              "renderControlledTransliteration",
          ):
              assert token not in desk, f"semantic translator hook remains: {token}"

          for token in ("ROMAN_LABELS", "Roman Normal", "Roman Title", "Roman Italic", "renderOghamParagraph", "verticalBTT"):
              assert token in desk, f"missing preserved direct-writing feature: {token}"

          print("Scribe verified: 20 direct writing hands; Sanskrit/Sumerian restored; Ogham BTT; RTL scripts preserved; translator packs removed")
          PY

          # Real device logs (Choreographer frame-skip warnings, ART GC
          # pressure, a low-memory-killer cascade that killed the print
          # spooler) confirmed Scribe's ~15MB payload (code + 217 images)
          # being parsed/held in memory on every app cold start - whether
          # or not Scribe is ever opened that session - is the dominant
          # cause of app lag and memory pressure. Applied last, after every
          # content check above has verified the eager PAGES.scribe form,
          # so this only changes *when* the identical content is parsed.
          python tools/patch_lazy_load_scribe.py "$WORK/current.html" "$WORK/current-lazy-scribe.html"
          mv "$WORK/current-lazy-scribe.html" "$WORK/current.html"
          node tools/verify_inline_scripts.js "$WORK/current.html"

          echo "WORK=$WORK" >> "$GITHUB_ENV"

      - name: Restore exact V28 native files
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/current-build-20260907/BoundBookStore.java" "$WORK/BoundBookStore.java"
          git show 44e113dac3b6e9bb3c2f8aeac07b9dad0b0d39da:tools/patch_register_bound_store.py > "$WORK/patch_register_bound_store.py"

      - name: Compile V28 BoundBookStore only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK/helper-classes" "$WORK/helper-dex"
          javac -source 8 -target 8             -cp "$ANDROID_HOME/platforms/android-35/android.jar"             -d "$WORK/helper-classes"             "$WORK/BoundBookStore.java"
          "$ANDROID_HOME/build-tools/35.0.0/d8"             --min-api 29             --output "$WORK/helper-dex"             "$WORK/helper-classes/com/greenman/hedgewitchery/BoundBookStore.class"

      - name: Decode shell and install current HTML on V28 base
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --show-error --silent             -o "$WORK/apktool.jar"             https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          java -jar "$WORK/apktool.jar" d -f             "$GITHUB_WORKSPACE/GREENMAN_HEDGEWITCHERY.apk"             -o "$WORK/decoded"

          python "$WORK/patch_register_bound_store.py"             "$WORK/decoded/smali_classes2/com/greenman/hedgewitchery/MainActivity.smali"

          # Real-device logcat (Acer tablet, Android 13) confirmed a crash
          # on every open: enterImmersiveMode() called before
          # setContentView() in onCreate() throws a NullPointerException
          # in PhoneWindow.getInsetsController() on this OEM's build. Fix
          # is to call it after setContentView() instead - see
          # tools/patch_immersive_mode_order.py for the full trace.
          python tools/patch_immersive_mode_order.py             "$WORK/decoded/smali_classes2/com/greenman/hedgewitchery/MainActivity.smali"

          python - "$WORK/decoded/smali_classes2/com/greenman/hedgewitchery/MainActivity.smali" <<'PY'
          import sys
          s=open(sys.argv[1],encoding='utf-8').read()
          repaired=(
              '    invoke-virtual {p0, v0}, Lcom/greenman/hedgewitchery/MainActivity;->setContentView(Landroid/view/View;)V\n\n'
              '    .line 60\n'
              '    invoke-direct {p0}, Lcom/greenman/hedgewitchery/MainActivity;->enterImmersiveMode()V\n'
          )
          assert s.count(repaired)==1, 'tablet crash repair sequence is missing or duplicated'
          print('tablet crash repair confirmed: setContentView precedes immersive mode')
          PY

          cp "$WORK/current.html" "$WORK/decoded/assets/index.html"
          sed -i 's/versionCode: 30/versionCode: 65/' "$WORK/decoded/apktool.yml"
          sed -i 's/versionName: .*/versionName: FV3/' "$WORK/decoded/apktool.yml"

          if grep -Fq 'ScribePdfService' "$WORK/decoded/AndroidManifest.xml"; then exit 1; fi
          if grep -Fq 'android.permission.FOREGROUND_SERVICE' "$WORK/decoded/AndroidManifest.xml"; then exit 1; fi
          if grep -Fq 'android:process=":bosrender"' "$WORK/decoded/AndroidManifest.xml"; then exit 1; fi

      - name: Add V28 helper class
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK/helper-apk"
          unzip -p "$GITHUB_WORKSPACE/GREENMAN_HEDGEWITCHERY.apk" AndroidManifest.xml > "$WORK/helper-apk/AndroidManifest.xml"
          cp "$WORK/helper-dex/classes.dex" "$WORK/helper-apk/classes.dex"
          cd "$WORK/helper-apk"
          zip -q "$WORK/helper.apk" AndroidManifest.xml classes.dex

          java -jar "$WORK/apktool.jar" d -f -r "$WORK/helper.apk" -o "$WORK/helper-decoded"
          HELPER_SMALI="$(find "$WORK/helper-decoded" -type f -name 'BoundBookStore.smali' -print -quit)"
          test -n "$HELPER_SMALI"
          mkdir -p "$WORK/decoded/smali_classes3/com/greenman/hedgewitchery"
          cp "$HELPER_SMALI" "$WORK/decoded/smali_classes3/com/greenman/hedgewitchery/BoundBookStore.smali"

          grep -Fq 'beginLastBoundPdf' "$WORK/decoded/smali_classes3/com/greenman/hedgewitchery/BoundBookStore.smali"
          grep -Fq 'exportLastBoundPdf' "$WORK/decoded/smali_classes3/com/greenman/hedgewitchery/BoundBookStore.smali"
          grep -Fq 'beginPdfCopy' "$WORK/decoded/smali_classes3/com/greenman/hedgewitchery/BoundBookStore.smali"
          grep -Fq 'readLastBoundPdfChunk' "$WORK/decoded/smali_classes3/com/greenman/hedgewitchery/BoundBookStore.smali"
          grep -Fq 'exportLastBoundPdfAs' "$WORK/decoded/smali_classes3/com/greenman/hedgewitchery/BoundBookStore.smali"
          grep -Fq 'exportSelectedPagesAs' "$WORK/decoded/smali_classes3/com/greenman/hedgewitchery/BoundBookStore.smali"
          grep -Fq 'lastError' "$WORK/decoded/smali_classes3/com/greenman/hedgewitchery/BoundBookStore.smali"

      - name: Build align and sign
        shell: bash
        run: |
          set -euo pipefail
          java -jar "$WORK/apktool.jar" b "$WORK/decoded" -o "$WORK/unsigned.apk"

          # apktool's rebuild does not reliably keep resources.arsc stored
          # uncompressed. Android 11+ (API 30+) refuses to install an APK
          # where it isn't, and zipalign cannot fix a compressed entry after
          # the fact - it only aligns entries that are already stored. So
          # this has to run here, between build and zipalign.
          python tools/force_resources_arsc_stored.py "$WORK/unsigned.apk"

          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -p -f 4 "$WORK/unsigned.apk" "$WORK/aligned.apk"

          mkdir -p "$HOME/.android"
          base64 --decode tools/greenman_debug_keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

          "$BT/apksigner" sign             --ks "$HOME/.android/debug.keystore"             --ks-key-alias androiddebugkey             --ks-pass pass:android             --key-pass pass:android             --out "$RUNNER_TEMP/GREENMAN_HEDGEWITCHERY_APOTHECARY_FV3.apk"             "$WORK/aligned.apk"

      - name: Verify V28-base APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/GREENMAN_HEDGEWITCHERY_APOTHECARY_FV3.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"

          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee "$WORK/apksigner.txt"
          "$BT/zipalign" -c -v 4 "$APK" >/dev/null
          "$BT/aapt" dump badging "$APK" | tee "$WORK/badging.txt"

          # Hard gate: resources.arsc MUST be stored uncompressed, or the
          # OS refuses to install this on Android 11+ (API 30+) at all -
          # zipalign's own -c check does not catch this, since it only
          # verifies alignment of entries that are already stored.
          python - "$APK" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              info = z.getinfo('resources.arsc')
              if info.compress_type != zipfile.ZIP_STORED:
                  raise SystemExit('resources.arsc is compressed - this APK will fail to install on Android 11+')
          print('resources.arsc confirmed stored uncompressed')
          PY

          grep -q "package: name='com.greenman.hedgewitchery' versionCode='65'" "$WORK/badging.txt"
          grep -q "versionName='FV3'" "$WORK/badging.txt"
          unzip -p "$APK" assets/index.html > "$WORK/final-index.html"
          cmp "$WORK/final-index.html" "$WORK/current.html"
          node tools/verify_inline_scripts.js "$WORK/final-index.html"

          grep -Fq 'INKPOT V2.7.30: Ink Pot saves only an exact copy of the completed bound PDF; all chapter/page/spell filtering removed from this room.' "$WORK/final-index.html"
