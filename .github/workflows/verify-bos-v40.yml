name: Verify BoS V40 Scribe Print and Ink Pot Vine
on:
  pull_request:
    branches: [main]
    paths:
      - "tools/bos_scribe_a4_v40.js"
      - "tools/bos_vine_pdf_v40.css"
      - "tools/patch_v40_scribe_pdf_vine.py"
      - "tests/test_v40_scribe_pdf.js"
      - ".github/workflows/verify-bos-v40.yml"
  push:
    branches: [design/bos-manuscript-v39-safe]
    paths:
      - "tools/bos_scribe_a4_v40.js"
      - "tools/bos_vine_pdf_v40.css"
      - "tools/patch_v40_scribe_pdf_vine.py"
      - "tests/test_v40_scribe_pdf.js"
      - ".github/workflows/verify-bos-v40.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python and JavaScript
        run: |
          python -m py_compile tools/patch_v40_scribe_pdf_vine.py
          node --check tools/bos_scribe_a4_v40.js
          node --check tests/test_v40_scribe_pdf.js
          node tests/test_v40_scribe_pdf.js
      - name: Verify print-only leaf and vine styles remain isolated
        run: |
          grep -Fq '.gmBosPrintSheet .gmStoryVine' tools/bos_vine_pdf_v40.css
          grep -Fq 'vector-effect:none!important' tools/bos_vine_pdf_v40.css
          if grep -Eq 'android.permission|keystore|apksigner|localStorage' tools/bos_scribe_a4_v40.js tools/bos_vine_pdf_v40.css; then exit 1; fi
