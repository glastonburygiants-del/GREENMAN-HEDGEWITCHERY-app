<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Greenman HedgeWitchery Apothecary Stocktake</title>
<style>
:root{--bg:#eee6cf;--paper:#fffaf0;--green:#244c35;--line:#c9b78d;--muted:#756d5f}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);font-family:Georgia,serif;color:#29241c}
#outer{height:100%;display:flex;flex-direction:column}
.outerbar{background:#eee6cff7;border-bottom:1px solid var(--line);padding:7px;z-index:30}
.brand{font-weight:bold;color:var(--green);font-size:15px;text-align:center;margin-bottom:6px}
.outertabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:1px}
.outertabs button{flex:0 0 auto;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font:700 12px Georgia,serif;color:#29241c}
.outertabs button.on{background:var(--green);color:white}
.framewrap{flex:1;min-height:0}
iframe{border:0;width:100%;height:100%;display:none;background:var(--bg)}
iframe.on{display:block}
#summary{display:none;overflow:auto;height:100%;padding:8px;max-width:1180px;margin:auto;width:100%}
#summary.on{display:block}
.sumhead{position:sticky;top:0;background:var(--bg);padding:3px 0 8px;z-index:5}
.sumhead h2{font-size:18px;color:var(--green);margin:0 0 6px}
.sumfilters{display:flex;gap:5px;overflow:auto}
.sumfilters button{padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--paper);font:700 11px Georgia}
.sumfilters button.on{background:var(--green);color:white}
.valueTotals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0 0 8px}
.valueBox{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px}
.valueBox span{display:block;font-size:10px;color:var(--muted)}
.valueBox strong{display:block;color:var(--green);font-size:17px;margin-top:2px}
.valueBox.grand{border:2px solid var(--green)}
.valueBox small{display:block;color:var(--muted);font-size:9px;margin-top:2px}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:9px;background:var(--paper)}
table{border-collapse:collapse;width:100%;min-width:980px}
th,td{padding:7px;border-bottom:1px solid #dfd1b1;font-size:12px;text-align:left}
th{background:#e7ddc4;color:var(--green);position:sticky;top:54px;z-index:2}
tr:nth-child(even) td{background:#fbf5e7}
td b{color:var(--green)}
.small{font-size:10px;color:var(--muted)}
.supplier a{color:var(--green);font-weight:bold;text-decoration:none}
@media(max-width:700px){.valueTotals{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>

function N(v){const n=parseFloat(v);return Number.isFinite(n)?n:0}
function F(v){const n=parseFloat(v);return Number.isFinite(n)?n:NaN}
function M(v){return Number.isFinite(v)?'£'+v.toFixed(v<0.1?3:2):'—'}
function Q(v,u,extra){if(!Number.isFinite(v))return'—';let s=(Math.round(v*1000)/1000).toLocaleString();return s+(u?' '+u:'')+(extra?' · '+extra:'')}
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function wildwoodMode(){try{const m=String(localStorage.getItem('gm_app_mode')||'').toLowerCase();return m==='master'||localStorage.getItem('gm_master_mode')==='1';}catch(e){return false}}
function frameApi(k){try{return document.getElementById('f-'+k).contentWindow.__stockAPI||null}catch(e){return null}}
function readWild(){try{const x=JSON.parse(localStorage.getItem(WILD_KEY)||'{}');return x&&typeof x==='object'?x:{}}catch(e){return {}}}
function writeWild(w){try{localStorage.setItem(WILD_KEY,JSON.stringify(w))}catch(e){}}
function supplierFrom(o){
 const u=o.old_url||o.url||'';let n='';
 if(u.includes('baldwins'))n='G. Baldwin & Co';
 else if(u.includes('bristolbotanicals'))n='Bristol Botanicals';
 else if(u.includes('woodlandherbs'))n='Woodland Herbs';
 else if(u.includes('barnflorist'))n='Barn Florist';
 else if(u.includes('gompels'))n='Gompels';
 else if(u.includes('specialingredients'))n='Special Ingredients';
 else if(u.includes('rockshopwholesale'))n='Rockshop Wholesale';
 else if(u.includes('crystalage'))n='Crystal Age';
 else if(u.includes('cornrigs'))n='Cornrigs';
 else if(u.includes('otherwisetrading'))n='Otherwise Trading';
 else if(u.includes('barnitts'))n='Barnitts';
 else if(u.includes('confettibee'))n='Confetti Bee';
 else if(u.includes('eco-craft'))n='Eco-Craft';
 else if(u.includes('somethingdifferent'))n='Something Different Wholesale';
 else if(u)n='Supplier';
 return{name:n,url:u};
}
function aliases(name,section){
 const a=[name];
 if(section==='Candle')a.push(name+' Candle');
 if(name==='ANISE')a.push('Star Anise','STAR ANISE');
 if(name==='VIOLET LEAVES')a.push('Violet','VIOLET','Violet Leaves');
 if(name==='Tourmalinee Black')a.push('Tourmaline Black','Black Tourmaline');
 if(name==='Copper flakes')a.push('Copper','Native Copper');
 if(name==="Pyrite (Fool's Gold)")a.push('Pyrite','Cocada Pyrite');
 return a;
}
function findWild(group,names){
 const w=readWild(),g=w[group];if(!g||typeof g!=='object')return null;
 for(const nm of names){const k=Object.keys(g).find(x=>norm(x)===norm(nm));if(k!=null&&Number.isFinite(Number(g[k])))return{key:k,value:Number(g[k]),w}}
 return null;
}
function setWild(group,names,v){
 const w=readWild();w[group]=w[group]||{};let k=null;
 for(const nm of names){k=Object.keys(w[group]).find(x=>norm(x)===norm(nm));if(k)break;}
 if(!k)k=names[0];w[group][k]=Math.max(0,Math.floor(v));writeWild(w);return w[group][k];
}

document.querySelectorAll('.outertabs button').forEach(b=>b.onclick=()=>show(b.dataset.page));
function show(p){
 current=p;
 document.querySelectorAll('.outertabs button').forEach(b=>b.classList.toggle('on',b.dataset.page===p));
 document.querySelectorAll('iframe').forEach(f=>f.classList.remove('on'));
 document.getElementById('summary').classList.remove('on');
 if(p==='summary'){document.getElementById('summary').classList.add('on');renderSummary();}
 else document.getElementById('f-'+p).classList.add('on');
}

function collectBase(){
 const out=[];

 const h=frameApi('herbs');
 if(h)h.items().forEach(o=>{
  const x=h.get(o.name),z=h.calc(o.name),isCount=x.mode==='count';
  const total=isCount?F(x.stockCount):F(x.stockG);
  const per=isCount?F(x.unitCount):F(x.envelopeG);
  const sup=supplierFrom(o);
  out.push({
    id:'H:'+o.name,section:'Herb',name:o.name,group:'Herbs',aliases:aliases(o.name,'Herb'),
    total:Number.isFinite(total)?total:0,per:Number.isFinite(per)&&per>0?per:NaN,unit:isCount?'each':'g',
    cost:z&&Number.isFinite(z.spellCost)?z.spellCost:NaN,
    value:z&&Number.isFinite(z.stockValue)?z.stockValue:NaN,
    supplier:sup,setTotal:v=>h.setTotal(o.name,v),kind:'ingredient'
  });
 });

 const c=frameApi('crystals');
 if(c)c.items().forEach(o=>{
  const x=c.get(o.name),z=c.calc(o.name),total=F(x.countLeft),weight=F(x.weightLeft),sup=supplierFrom(o);
  const avg=(Number.isFinite(total)&&total>0&&Number.isFinite(weight))?weight/total:NaN;
  out.push({
    id:'C:'+o.name,section:'Crystal',name:o.name,group:'Crystals',aliases:aliases(o.name,'Crystal'),
    total:Number.isFinite(total)?total:0,per:1,unit:'each',
    stockExtra:Number.isFinite(weight)?Q(weight,'g'):'',
    avg:avg,cost:z&&Number.isFinite(z.costUsedNow)?z.costUsedNow:NaN,
    value:z&&Number.isFinite(z.currentStockValue)?z.currentStockValue:NaN,
    supplier:sup,setTotal:v=>c.setTotal(o.name,v),kind:'ingredient'
  });
 });

 const o=frameApi('oils');
 if(o)o.items().forEach(it=>{
  const x=o.get(it.name),z=o.calc(it.name),total=F(x.leftMl),per=F(x.portionMl),sup=supplierFrom(it);
  const bought=F(x.boughtMl),cost=F(x.oldCost);
  const value=Number.isFinite(total)&&Number.isFinite(bought)&&bought>0&&Number.isFinite(cost)?total*(cost/bought):NaN;
  out.push({
    id:'O:'+it.name,section:'Oil',name:it.name,group:'Oils',aliases:aliases(it.name,'Oil'),
    total:Number.isFinite(total)?total:0,per:Number.isFinite(per)&&per>0?per:NaN,unit:'ml',
    cost:z&&Number.isFinite(z.costPortion)?z.costPortion:NaN,value,supplier:sup,
    setTotal:v=>o.setTotal(it.name,v),kind:'ingredient'
  });
 });

 const ca=frameApi('candles');
 if(ca)ca.items().forEach(it=>{
  const x=ca.get(it.name),z=ca.calc(it.name),total=F(x.count),sp=ca.supplier(it.name);
  out.push({
   id:'D:'+it.name,section:'Candle',name:it.name,group:'Candles',aliases:aliases(it.name,'Candle'),
   total:Number.isFinite(total)?total:0,per:1,unit:'each',
   cost:z&&Number.isFinite(z.each)?z.each:NaN,value:z&&Number.isFinite(z.value)?z.value:NaN,
   supplier:{name:sp[0],url:sp[1]},setTotal:v=>ca.setTotal(it.name,v),kind:'ingredient'
  });
 });

 const rr=frameApi('rest');
 if(rr){
   const use={small:2,large:11,oil2:1,jar:1,bag:1,dish:1,charcoal:3,mailer:1};
   const labels={small:'Small glassine bags 65×65 mm',large:'Large glassine bags 92×68 mm',oil2:'2 ml amber customer bottles',
     jar:'106 ml Zigzag black jar + lid set',bag:'Cream hessian charm bags',dish:'Crystal Witch trinket dishes',
     charcoal:'Charcoal discs',stickers:'57×30 mm thermal sticker rolls',paper:'A4 thermal paper 8 m rolls',
     mailer:'Outer mailer / parcel pack',work100:'100 ml amber bottles with pipettes'};
   rr.items().forEach(it=>{
     if(it.id==='lid')return; // jar row is the complete jar + lid set to avoid double-counting value.
     let total=F(rr.getItem(it.id).qty);
     if(it.id==='jar'){
       const lid=F(rr.getItem('lid').qty);
       if(Number.isFinite(lid))total=Math.min(Number.isFinite(total)?total:0,lid);
     }
     const per=use[it.id], uc=rr.unitCost(it.id), sp=rr.supplier(it.id);
     out.push({
       id:'K:'+it.id,section:'Kit',name:labels[it.id]||it.name,group:'Sundries',aliases:[it.name],
       total:Number.isFinite(total)?total:0,per:Number.isFinite(per)?per:NaN,unit:'each',
       cost:Number.isFinite(uc)&&Number.isFinite(per)?uc*per:NaN,
       value:Number.isFinite(uc)&&Number.isFinite(total)?uc*total:NaN,
       supplier:{name:sp[0],url:sp[1]},
       setTotal:v=>{rr.setItemTotal(it.id,v);if(it.id==='jar')rr.setItemTotal('lid',v);},
       kind:'kit'
     });
   });
   rr.runes().forEach(n=>{
     const total=F(rr.getRune(n).qty);
     out.push({
       id:'R:'+n,section:'Rune',name:n,group:'Runes',aliases:[n],
       total:Number.isFinite(total)?total:0,per:1,unit:'each',cost:0,value:0,
       supplier:{name:'Made by us',url:''},setTotal:v=>rr.setRuneTotal(n,v),kind:'ingredient'
     });
   });
 }
 return out;
}

function applyIngredientSplit(row){
 if(!Number.isFinite(row.per)||row.per<=0){
   row.stall=NaN;row.online=row.total;row.onlineSpells=NaN;return row;
 }
 const available=Math.floor(row.total/row.per+1e-9);
 const target=Math.max(0,Math.min(7,available));
 const rec=split[row.id]||{};
 let fw=findWild(row.group,row.aliases);

 // First use: establish a seven-spell Wildwood pool, but never restore a pool already below 7.
 if(!fw){
   setWild(row.group,row.aliases,target);fw=findWild(row.group,row.aliases);
 }else if(fw.value>7){
   setWild(row.group,row.aliases,target);fw=findWild(row.group,row.aliases);
 }
 let stallSpells=fw?Math.min(target,Math.max(0,fw.value)):target;

 if(rec.lastTotal==null){
   rec.lastTotal=row.total;rec.lastWild=stallSpells;rec.online=Math.max(0,row.total-stallSpells*row.per);
 }else{
   // Manual stocktake change/restock: split again with seven portions to Stall first.
   if(Math.abs(row.total-rec.lastTotal)>1e-7 && !syncBusy){
     const reset=Math.max(0,Math.min(7,Math.floor(row.total/row.per+1e-9)));
     setWild(row.group,row.aliases,reset);stallSpells=reset;
     rec.online=Math.max(0,row.total-reset*row.per);
     rec.lastWild=reset;rec.lastTotal=row.total;
   }
   // Wildwood local stock decrease: reduce physical stock by exactly the same used amount.
   else if(wildwoodMode() && stallSpells<Number(rec.lastWild||0) && !syncBusy){
     const used=(Number(rec.lastWild||0)-stallSpells)*row.per;
     const newTotal=Math.max(0,row.total-used);
     syncBusy=true;try{row.setTotal(newTotal)}finally{syncBusy=false}
     row.total=newTotal;rec.lastTotal=newTotal;rec.lastWild=stallSpells;
     // rec.online deliberately stays unchanged.
   }
   else{
     rec.lastWild=stallSpells;rec.lastTotal=row.total;
     if(!Number.isFinite(Number(rec.online)))rec.online=Math.max(0,row.total-stallSpells*row.per);
   }
 }
 split[row.id]=rec;saveSplit();
 row.stallSpells=stallSpells;
 row.stall=stallSpells*row.per;
 row.online=Math.max(0,Number(rec.online));
 row.onlineSpells=Math.floor(row.online/row.per+1e-9);
 if(row.section==='Crystal'&&Number.isFinite(row.avg)){
   row.stallExtra=Q(row.stall*row.avg,'g');row.onlineExtra=Q(row.online*row.avg,'g');
 }
 return row;
}

function applyKitSplit(row){
 const rec=split[row.id]||{};
 if(!Number.isFinite(row.per)||row.per<=0){
   row.stall=NaN;row.online=NaN;row.onlineSpells=NaN;return row;
 }
 const target=Math.max(0,Math.min(7,Math.floor(row.total/row.per+1e-9)));
 if(rec.lastTotal==null){
   rec.stallSpells=target;rec.online=Math.max(0,row.total-target*row.per);rec.lastTotal=row.total;
 }else if(Math.abs(row.total-rec.lastTotal)>1e-7 && !syncBusy){
   // Manual stocktake edit/restock resets this local Stall reserve to seven.
   rec.stallSpells=target;rec.online=Math.max(0,row.total-target*row.per);rec.lastTotal=row.total;
 }
 const stallSpells=Math.max(0,Math.min(Number(rec.stallSpells||0),Math.floor(row.total/row.per+1e-9)));
 rec.stallSpells=stallSpells;split[row.id]=rec;saveSplit();
 row.stallSpells=stallSpells;row.stall=stallSpells*row.per;row.online=Math.max(0,Number(rec.online||0));
 row.onlineSpells=Math.floor(row.online/row.per+1e-9);return row;
}

function collect(){
 return collectBase().map(r=>r.kind==='ingredient'?applyIngredientSplit(r):applyKitSplit(r));
}

function processNewWildwoodLogs(){
 if(!wildwoodMode())return;
 let logs=[];try{logs=JSON.parse(localStorage.getItem(WILD_LOG)||'[]');if(!Array.isArray(logs))logs=[]}catch(e){logs=[]}
 if(!split.__wildLogPrimed){
   split.__seenLogs=logs.map(x=>String(x.id||x.createdAt||'')).filter(Boolean).slice(-1500);
   split.__wildLogPrimed=true;saveSplit();return;
 }
 const seen=new Set(split.__seenLogs||[]), rr=frameApi('rest');if(!rr)return;
 let changed=false;
 for(const log of logs){
   const id=String(log.id||log.createdAt||'');if(!id||seen.has(id))continue;
   const items=Array.isArray(log.items)?log.items:[];
   const herbs=items.filter(x=>String(x.group||'')==='Herbs').length;
   const sundry=items.find(x=>String(x.group||'')==='Sundries');
   const dec=(itemId,q)=>{
     const st=rr.getItem(itemId),before=N(st.qty),after=Math.max(0,before-q);
     rr.setItemTotal(itemId,after);
     const rec=split['K:'+itemId]||{};
     if(Number.isFinite(Number(rec.stallSpells))){
       const per={small:2,large:11,oil2:1,jar:1,bag:1,dish:1,charcoal:3}[itemId];
       if(per)rec.stallSpells=Math.max(0,Number(rec.stallSpells)-q/per);
     }
     rec.lastTotal=after;split['K:'+itemId]=rec;
   };
   dec('small',2);
   if(herbs>0)dec('large',herbs);
   dec('oil2',1);
   if(sundry){
     const n=norm(sundry.name);
     if(n===norm('Spell Jar')){dec('jar',1);dec('lid',1);}
     else if(n.includes('charm bag'))dec('bag',1);
     else if(n===norm('Charcoal Disk Pack of 3')){dec('charcoal',3);dec('dish',1);}
   }
   seen.add(id);changed=true;
 }
 if(changed){split.__seenLogs=Array.from(seen).slice(-1500);saveSplit();rr.refresh();}
}

function fmt(row,which){
 const v=row[which];if(!Number.isFinite(v))return'—';
 let extra='';
 if(which==='total')extra=row.stockExtra||'';
 if(which==='stall')extra=row.stallExtra||'';
 if(which==='online')extra=row.onlineExtra||'';
 return Q(v,row.unit,extra);
}
function renderFilters(rows){
 const cats=['All','Herb','Crystal','Oil','Candle','Rune','Kit'];
 sumfilters.innerHTML=cats.map(c=>`<button class="${c===sumCat?'on':''}" onclick="sumCat='${c}';renderSummary()">${c==='All'?'All':c+(c==='Herb'?'s':c==='Crystal'?'s':c==='Oil'?'s':c==='Candle'?'s':c==='Rune'?'s':' / Consumables')}</button>`).join('');
}
function renderSummary(){
 processNewWildwoodLogs();
 let all=collect();renderFilters(all);
 const groups=['Herb','Crystal','Oil','Candle','Rune','Kit'];
 const labels={Herb:'Herbs',Crystal:'Crystals',Oil:'Oils',Candle:'Candles',Rune:'Runes',Kit:'Kit / Consumables'};
 const totals={},missing={};
 groups.forEach(g=>{
   const rows=all.filter(r=>r.section===g&&r.total>0);
   totals[g]=rows.filter(r=>Number.isFinite(r.value)).reduce((a,r)=>a+r.value,0);
   missing[g]=rows.filter(r=>!Number.isFinite(r.value)).length;
 });
 const grand=groups.reduce((a,g)=>a+totals[g],0),missingAll=groups.reduce((a,g)=>a+missing[g],0);
 valueTotals.innerHTML=groups.map(g=>`<div class="valueBox"><span>${labels[g]} stock value</span><strong>${M(totals[g])}</strong>${missing[g]?`<small>${missing[g]} unpriced stock item${missing[g]===1?'':'s'} not included</small>`:''}</div>`).join('')+
 `<div class="valueBox grand"><span>Total Stock Value</span><strong>${M(grand)}</strong>${missingAll?`<small>${missingAll} unpriced stock item${missingAll===1?'':'s'} not included</small>`:''}</div>`;
 let rows=sumCat==='All'?all:all.filter(r=>r.section===sumCat);
 sumrows.innerHTML=rows.map(r=>`<tr>
  <td><b>${r.name}</b></td><td>${r.section}</td>
  <td>${fmt(r,'total')}</td><td>${fmt(r,'stall')}</td><td>${fmt(r,'online')}</td>
  <td>${Number.isFinite(r.onlineSpells)?r.onlineSpells:'—'}</td>
  <td>${M(r.cost)}</td><td>${M(r.value)}</td>
  <td class="supplier">${r.supplier.name||'—'}${r.supplier.url?` · <a href="${r.supplier.url}" target="_blank" rel="noopener">supplier</a>`:''}</td>
 </tr>`).join('');
}

setInterval(()=>{if(current==='summary')renderSummary();else if(wildwoodMode()){processNewWildwoodLogs();collect();}},1400);
